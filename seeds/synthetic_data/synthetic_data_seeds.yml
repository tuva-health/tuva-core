version: 2

seeds:
  - name: synthetic_data__appointment
    description: |-
      Synthetic appointment records provide non-PHI clinical scheduling data for local development, demos,
      documentation, and integration testing. They are maintained by Tuva Health.
    config:
      meta:
        primary_key_columns:
          - appointment_id
          - data_source
        primary_key_strategy: natural_multi_column
      post_hook: "{{ load_versioned_synthetic_seed('synthetic_data__appointment') }}"
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_synthetic_data{% else %}synthetic_data{%- endif -%}
      alias: appointment
      tags:
        - synthetic_data
        - clinical
      enabled: true
      column_types:
        appointment_id: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(255) {%- endif -%}
        person_id: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(255) {%- endif -%}
        patient_id: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(255) {%- endif -%}
        encounter_id: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(255) {%- endif -%}
        start_datetime: |
          {%- if target.type in ("fabric") -%} datetime2(0) {%- elif target.type in ("athena", "databricks") -%} timestamp {%- else -%} datetime {%- endif -%}
        end_datetime: |
          {%- if target.type in ("fabric") -%} datetime2(0) {%- elif target.type in ("athena", "databricks") -%} timestamp {%- else -%} datetime {%- endif -%}
        duration: integer
        location_id: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(255) {%- endif -%}
        practitioner_id: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(255) {%- endif -%}
        type_code: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(255) {%- endif -%}
        type_description: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(255) {%- endif -%}
        status_code: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(255) {%- endif -%}
        status_description: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(255) {%- endif -%}
