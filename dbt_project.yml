name: 'the_tuva_project'
version: '1.0.0'
config-version: 2
require-dbt-version: [">=1.10.5", "<3.0.0"]

profile: default

flags:
  require_generic_test_arguments_property: true
vars:
  ## Optional model families
  parity_enabled: false

  ## Medication terminology
  # When true, every CodeRx consumer reads user-managed CodeRx Enterprise
  # tables from the coderx schema instead of the package's CodeRx Open assets.
  use_coderx_enterprise: false

  ## Seed storage configuration
  # Data-asset versions are intentionally independent from package code versions.
  tuva_core_data_asset_version: '1.1.0'
  custom_bucket_name: tuva-public-resources

  ## Run metadata
  # The date and timestamp of the dbt run that will populate the tuva_last_run column in all models.
  # Default timezone is UTC.
  tuva_last_run: '{{ run_started_at.astimezone(modules.pytz.timezone("UTC")) }}'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

dispatch:
  - macro_namespace: 'dbt_utils'
    search_order: ['the_tuva_project', 'dbt_utils']
