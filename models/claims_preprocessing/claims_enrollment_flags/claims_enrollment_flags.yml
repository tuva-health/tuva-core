version: 2

models:

#### Claims Enrollment Flags
## Final
  - name: claims_enrollment__flag_claims_with_enrollment
    description: This table contains medical claims with matching member-month enrollment. Eligibility matching stops at the calendar month containing the date portion of tuva_last_run for both open and finite spans, so future member months are not created.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_claims_preprocessing
        {%- else -%}claims_preprocessing{%- endif -%}
      alias: flag_claims_with_enrollment
      tags:
        - claims_preprocessing
      materialized: table
    columns:
      - name: claim_id
        description: Unique identifier for each claim.
      - name: claim_line_number
        description: >
          Indicates the line number for the particular line of the claim.
      - name: person_id
        description: Unique identifier for each patient in the dataset.
      - name: member_id
        description: Identifier assigned by the payer or health plan for the person's coverage during the member month.
      - name: payer
        description: Name of the payer.
      - name: plan
        description: Name of the plan.
      - name: data_source
        description: 'User-configured field that indicates the data source.'
      - name: member_month_id
        description: 'The unique combination of person_id, member_id, year_month, payer, plan, and data source.'
      - name: inferred_claim_start_year_month
        description: |
          The claim start date year and month.  If claim line start date is missing then the following column will be used, 
          in the following order if also NULL:  claim start date, admission date
      - name: inferred_claim_start_column_used
        description: The name of the column used to populate inferred_claim_start_year_month.
      - name: tuva_last_run
        description: Timestamp for when the model was last run.

  - name: claims_enrollment__flag_rx_claims_with_enrollment
    description: This table contains pharmacy claims with matching member-month enrollment. Each claim line is matched to the member month of its dispensing date, falling back to the paid date when the dispensing date is missing, which is the same month Core cost reporting uses for pharmacy spend. Eligibility matching stops at the calendar month containing the date portion of tuva_last_run for both open and finite spans, so future member months are not created.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_claims_preprocessing
        {%- else -%}claims_preprocessing{%- endif -%}
      alias: flag_rx_claims_with_enrollment
      tags:
        - claims_preprocessing
      materialized: table
    columns:
      - name: claim_id
        description: Unique identifier for each claim.
      - name: claim_line_number
        description: >
          Indicates the line number for the particular line of the claim.
      - name: person_id
        description: Unique identifier for each patient in the dataset.
      - name: member_id
        description: Identifier assigned by the payer or health plan for the person's coverage during the member month.
      - name: payer
        description: Name of the payer.
      - name: plan
        description: Name of the plan.
      - name: data_source
        description: 'User-configured field that indicates the data source.'
      - name: member_month_id
        description: 'The unique combination of person_id, member_id, year_month, payer, plan, and data source.'
      - name: paid_year_month
        description: The year and month of the date the pharmacy claim was paid. Informational only; enrollment is matched on inferred_claim_date_year_month.
      - name: inferred_claim_date_year_month
        description: |
          The year and month of the dispensing date. If the dispensing date is missing then the paid date is used.
          This is the member month the claim line is matched to.
      - name: inferred_claim_date_column_used
        description: The name of the column used to populate inferred_claim_date_year_month.
      - name: tuva_last_run
        description: Timestamp for when the model was last run.
