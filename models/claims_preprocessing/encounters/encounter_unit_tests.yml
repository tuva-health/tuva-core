version: 2

unit_tests:
  - name: test_combined_encounter_crosswalk_handles_undetermined_and_hospice_candidates
    description: >
      Broad same-day matchers can produce an encounter candidate for an
      undetermined claim. The final combined crosswalk must exclude that
      candidate while preserving the same classified candidate, so the
      undetermined line flows through the orphan fallback. It must also consume
      hospice professional-claim matches and place them below existing
      inpatient priorities but above outpatient candidates. Regression
      coverage for https://github.com/tuva-health/tuva-core/issues/1388 and
      https://github.com/tuva-health/tuva-core/issues/1394.
    model: encounters__combined_claim_line_crosswalk
    config:
      enabled: "{{ var('claims_enabled', false) | as_bool }}"
    overrides:
      vars:
        claims_enabled: true
    given:
      - input: ref('acute_inpatient__prof_claims')
        format: sql
        rows: &empty_crosswalk_rows |
          {% set string_type = 'string' if target.type in ['bigquery', 'databricks'] else 'varchar' %}
          {% set integer_type = 'int64' if target.type == 'bigquery' else 'bigint' %}
          select
                cast(null as {{ string_type }}) as claim_id
              , cast(null as {{ integer_type }}) as claim_line_number
              , cast(null as {{ string_type }}) as data_source
              , cast(null as {{ string_type }}) as encounter_id
              , cast(null as {{ string_type }}) as old_encounter_id
              , cast(null as {{ integer_type }}) as claim_attribution_number
              , cast(null as {{ string_type }}) as encounter_type
              , cast(null as {{ string_type }}) as encounter_group
              , cast(null as {{ integer_type }}) as priority_number
              , cast(null as {{ string_type }}) as anchor_claim_id
          from (select 1 as _tuva_empty_fixture) as _tuva_empty_fixture
          where 1 = 0
      - input: ref('emergency_department__prof_claims')
        format: sql
        rows: *empty_crosswalk_rows
      - input: ref('inpatient_psych__prof_claims')
        format: sql
        rows: *empty_crosswalk_rows
      - input: ref('inpatient_rehab__prof_claims')
        format: sql
        rows: *empty_crosswalk_rows
      - input: ref('inpatient_long_term__prof_claims')
        format: sql
        rows: *empty_crosswalk_rows
      - input: ref('inpatient_snf__prof_claims')
        format: sql
        rows: *empty_crosswalk_rows
      - input: ref('inpatient_hospice__prof_claims')
        format: sql
        rows: |
          select 'hospice_prof_claim' as claim_id, 1 as claim_line_number, 'source-a' as data_source, 'hospice-encounter' as encounter_id, 1 as claim_attribution_number
      - input: ref('inpatient_substance_use__prof_claims')
        format: sql
        rows: |
          select 'hospice_prof_claim' as claim_id, 1 as claim_line_number, 'source-a' as data_source, 'substance-encounter' as encounter_id, 1 as claim_attribution_number
      - input: ref('office_visits__int_office_visits_claim_line')
        format: sql
        rows: |
          select 'hospice_prof_claim' as claim_id, 1 as claim_line_number, 'source-a' as data_source, 'office-encounter' as old_encounter_id, 'office visit radiology' as encounter_type
      - input: ref('urgent_care__match_claims_to_anchor')
        format: sql
        rows: *empty_crosswalk_rows
      - input: ref('outpatient_psych__match_claims_to_anchor')
        format: sql
        rows: *empty_crosswalk_rows
      - input: ref('outpatient_rehab__match_claims_to_anchor')
        format: sql
        rows: *empty_crosswalk_rows
      - input: ref('asc__match_claims_to_anchor')
        format: sql
        rows: *empty_crosswalk_rows
      - input: ref('dialysis__match_claims_to_anchor')
        format: sql
        rows: *empty_crosswalk_rows
      - input: ref('outpatient_hospice__match_claims_to_anchor')
        format: sql
        rows: *empty_crosswalk_rows
      - input: ref('home_health__match_claims_to_anchor')
        format: sql
        rows: *empty_crosswalk_rows
      - input: ref('outpatient_surgery__match_claims_to_anchor')
        format: sql
        rows: *empty_crosswalk_rows
      - input: ref('outpatient_injections__match_claims_to_anchor')
        format: sql
        rows: |
          select 'undetermined_claim' as claim_id, 1 as claim_line_number, 'source-a' as data_source, 'anchor-1' as old_encounter_id
          union all
          select 'professional_claim', 1, 'source-a', 'anchor-1'
      - input: ref('outpatient_ptotst__match_claims_to_anchor')
        format: sql
        rows: *empty_crosswalk_rows
      - input: ref('outpatient_substance_use__match_claims_to_anchor')
        format: sql
        rows: *empty_crosswalk_rows
      - input: ref('outpatient_radiology__match_claims_to_anchor')
        format: sql
        rows: *empty_crosswalk_rows
      - input: ref('outpatient_hospital_or_clinic__match_claims_to_anchor')
        format: sql
        rows: *empty_crosswalk_rows
      - input: ref('encounters__int_institutional_claim_lines')
        format: sql
        rows: *empty_crosswalk_rows
      - input: ref('lab__match_claims_to_anchor')
        format: sql
        rows: *empty_crosswalk_rows
      - input: ref('dme__match_claims_to_anchor')
        format: sql
        rows: *empty_crosswalk_rows
      - input: ref('ambulance__match_claims_to_anchor')
        format: sql
        rows: *empty_crosswalk_rows
      - input: ref('encounters__stg_medical_claim')
        format: sql
        rows: |
          select 'undetermined_claim' as claim_id, 1 as claim_line_number, 'source-a' as data_source, 'undetermined' as claim_type
          union all
          select 'professional_claim', 1, 'source-a', 'professional'
    expect:
      rows:
        - claim_id: professional_claim
          claim_line_number: 1
          data_source: source-a
          old_encounter_id: anchor-1
          encounter_id: f1d4798551acd93ebdd672b219cc1aa4
          encounter_type: outpatient injections
          encounter_group: outpatient
          priority_number: 17
          anchor_claim_id: null
          claim_line_attribution_number: 1
        - claim_id: hospice_prof_claim
          claim_line_number: 1
          data_source: source-a
          old_encounter_id: substance-encounter
          encounter_id: 0584fcec3f1da8f2b829ca8c53e8d661
          encounter_type: inpatient substance use
          encounter_group: inpatient
          priority_number: 6
          anchor_claim_id: null
          claim_line_attribution_number: 1
        - claim_id: hospice_prof_claim
          claim_line_number: 1
          data_source: source-a
          old_encounter_id: hospice-encounter
          encounter_id: 6823a3d0e472c12d95ed4248c6456eed
          encounter_type: inpatient hospice
          encounter_group: inpatient
          priority_number: 7
          anchor_claim_id: null
          claim_line_attribution_number: 2
        - claim_id: hospice_prof_claim
          claim_line_number: 1
          data_source: source-a
          old_encounter_id: office-encounter
          encounter_id: d68e202bf46bc24eb2115642b57ccc06
          encounter_type: office visit radiology
          encounter_group: office based
          priority_number: 7
          anchor_claim_id: null
          claim_line_attribution_number: 3

  - name: test_patient_data_source_id_uses_unambiguous_stable_encoding
    description: >-
      Proves patient_data_source_id distinguishes pipe-delimited component
      boundaries, null, empty strings, and the former literal null sentinel.
      These cases collided under the pre-1.0 raw concatenation contract.
    model: encounters__patient_data_source_id
    config:
      enabled: "{{ var('claims_enabled', false) | as_bool }}"
    overrides:
      vars:
        claims_enabled: true
    given:
      - input: ref('normalized__medical_claim')
        format: sql
        rows: |
          {% set string_type = 'string' if target.type in ['bigquery', 'databricks'] else 'varchar' %}
          select 'a|b' as person_id, 'c' as data_source
          union all select 'a', 'b|c'
          union all select cast(null as {{ string_type }}), 'source'
      - input: ref('normalized__eligibility')
        format: sql
        rows: |
          select '<NULL>' as person_id, 'source' as data_source
          union all select '', 'source'
    expect:
      rows:
        - person_id: a|b
          data_source: c
          patient_data_source_id: 6df3a7e57fc92cfa0be719b5adf946f8
        - person_id: a
          data_source: b|c
          patient_data_source_id: e5310aa4d517cbca0fc4c5b827430b0c
        - person_id: null
          data_source: source
          patient_data_source_id: d52d0aaae616fbaf04b69c2e0a758efa
        - person_id: <NULL>
          data_source: source
          patient_data_source_id: 6c73a9dd22de8d9d6318a28394f496b3
        - person_id: ''
          data_source: source
          patient_data_source_id: ab07412b6175919ea556de5888d90102

  - name: test_undetermined_claim_lines_receive_source_scoped_orphan_encounters
    description: >
      Every line of an undetermined claim receives an orphan encounter. Lines
      from the same claim and source share an encounter ID, while reused claim
      keys in another source remain isolated. Regression coverage for
      https://github.com/tuva-health/tuva-core/issues/1388.
    model: encounters__orphaned_claims
    config:
      enabled: "{{ var('claims_enabled', false) | as_bool }}"
    given:
      - input: ref('encounters__stg_medical_claim')
        format: sql
        rows: |
          select
              'shared-undetermined' as claim_id
            , 1 as claim_line_number
            , 'other' as service_category_1
            , 'other' as service_category_2
            , 'other' as service_category_3
            , 'undetermined' as claim_type
            , cast('2024-01-01' as date) as claim_start_date
            , cast('2024-01-02' as date) as claim_end_date
            , cast('2024-01-01' as date) as start_date
            , cast('2024-01-01' as date) as end_date
            , 'person-1|source-a' as patient_data_source_id
            , 'source-a' as data_source
          union all
          select 'shared-undetermined', 2, 'other', 'other', 'other', 'undetermined', cast('2024-01-01' as date), cast('2024-01-02' as date), cast('2024-01-02' as date), cast('2024-01-02' as date), 'person-1|source-a', 'source-a'
          union all
          select 'shared-undetermined', 1, 'other', 'other', 'other', 'undetermined', cast('2024-02-01' as date), cast('2024-02-01' as date), cast('2024-02-01' as date), cast('2024-02-01' as date), 'person-1|source-b', 'source-b'
      - input: ref('encounters__combined_claim_line_crosswalk')
        format: sql
        rows: |
          {% set string_type = 'string' if target.type in ['bigquery', 'databricks'] else 'varchar' %}
          {% set integer_type = 'int64' if target.type == 'bigquery' else 'bigint' %}
          select
              cast(null as {{ string_type }}) as claim_id
            , cast(null as {{ integer_type }}) as claim_line_number
            , cast(null as {{ string_type }}) as data_source
          from (select 1 as _tuva_empty_fixture) as _tuva_empty_fixture where 1 = 0
    expect:
      rows:
        - claim_id: shared-undetermined
          claim_line_number: 1
          data_source: source-a
          encounter_id: 8064c56a071fed311a8a820b4c249ca1
          encounter_type: orphaned claim
          encounter_group: other
        - claim_id: shared-undetermined
          claim_line_number: 2
          data_source: source-a
          encounter_id: 8064c56a071fed311a8a820b4c249ca1
          encounter_type: orphaned claim
          encounter_group: other
        - claim_id: shared-undetermined
          claim_line_number: 1
          data_source: source-b
          encounter_id: f49d40e1f7a1b5865812f52b43f2a5eb
          encounter_type: orphaned claim
          encounter_group: other

  - name: test_orphaned_claims_scopes_crosswalk_by_data_source
    description: >
      When two sources reuse the same claim-line key, a crosswalk match in one
      source must not prevent the claim line in the other source from becoming
      an orphaned encounter. Regression coverage for
      https://github.com/tuva-health/tuva-core/pull/1370.
    model: encounters__orphaned_claims
    config:
      enabled: "{{ var('claims_enabled', false) | as_bool }}"
    given:
      - input: ref('encounters__stg_medical_claim')
        format: sql
        rows: |
          select
              'shared_claim' as claim_id
            , 1 as claim_line_number
            , 'other' as service_category_1
            , 'other' as service_category_2
            , 'other' as service_category_3
            , 'professional' as claim_type
            , cast('2024-01-01' as date) as claim_start_date
            , cast('2024-01-01' as date) as claim_end_date
            , cast('2024-01-01' as date) as start_date
            , cast('2024-01-01' as date) as end_date
            , 'person_1|source_a' as patient_data_source_id
            , 'source_a' as data_source
          union all
          select
              'shared_claim' as claim_id
            , 1 as claim_line_number
            , 'other' as service_category_1
            , 'other' as service_category_2
            , 'other' as service_category_3
            , 'professional' as claim_type
            , cast('2024-01-01' as date) as claim_start_date
            , cast('2024-01-01' as date) as claim_end_date
            , cast('2024-01-01' as date) as start_date
            , cast('2024-01-01' as date) as end_date
            , 'person_1|source_b' as patient_data_source_id
            , 'source_b' as data_source
      - input: ref('encounters__combined_claim_line_crosswalk')
        format: sql
        rows: |
          select
              'shared_claim' as claim_id
            , 1 as claim_line_number
            , 'source_a' as data_source
    expect:
      rows:
        - claim_id: 'shared_claim'
          claim_line_number: 1
          data_source: 'source_b'
          encounter_id: '3fea38bb36c37ec87adde74cfe8825ab'
          encounter_type: 'orphaned claim'
          encounter_group: 'other'

  - name: test_orphaned_claim_encounter_end_date_uses_line_end_dates
    description: >
      An orphaned claim encounter spans the service dates of its claim lines.
      The encounter end date is the latest line end date, falling back to the
      line start date when the end date is missing or precedes the start
      date, so a multi-day claim without line-level dates keeps its claim end
      date instead of collapsing to the start date.
    model: orphaned_claim__encounter_grain
    config:
      enabled: "{{ var('claims_enabled', false) | as_bool }}"
    given:
      - input: ref('encounters__stg_medical_claim')
        format: sql
        rows: |
          {% set string_type = 'string' if target.type in ['bigquery', 'databricks'] else 'varchar' %}
          {% set numeric_type = 'numeric' if target.type == 'bigquery' else 'decimal(28, 4)' %}
          select
              'multi-day-claim' as claim_id
            , 1 as claim_line_number
            , 'undetermined' as claim_type
            , cast('2024-01-01' as date) as start_date
            , cast('2024-01-10' as date) as end_date
            , 'person-1|source-a' as patient_data_source_id
            , 'source-a' as data_source
            , cast(100 as {{ numeric_type }}) as paid_amount
            , cast(120 as {{ numeric_type }}) as allowed_amount
            , cast(150 as {{ numeric_type }}) as charge_amount
            , cast(null as {{ string_type }}) as diagnosis_code_1
            , cast(null as {{ string_type }}) as diagnosis_code_type
            , cast(null as {{ string_type }}) as facility_npi
            , cast(null as {{ string_type }}) as place_of_service_code
            , cast(null as {{ string_type }}) as place_of_service_description
          union all
          select 'multi-line-claim', 1, 'professional', cast('2024-02-01' as date), cast('2024-02-04' as date), 'person-1|source-a', 'source-a', cast(10 as {{ numeric_type }}), cast(10 as {{ numeric_type }}), cast(10 as {{ numeric_type }}), cast(null as {{ string_type }}), cast(null as {{ string_type }}), cast(null as {{ string_type }}), cast(null as {{ string_type }}), cast(null as {{ string_type }})
          union all
          select 'multi-line-claim', 2, 'professional', cast('2024-02-02' as date), cast('2024-02-02' as date), 'person-1|source-a', 'source-a', cast(10 as {{ numeric_type }}), cast(10 as {{ numeric_type }}), cast(10 as {{ numeric_type }}), cast(null as {{ string_type }}), cast(null as {{ string_type }}), cast(null as {{ string_type }}), cast(null as {{ string_type }}), cast(null as {{ string_type }})
          union all
          select 'missing-end-claim', 1, 'professional', cast('2024-03-01' as date), cast(null as date), 'person-1|source-a', 'source-a', cast(10 as {{ numeric_type }}), cast(10 as {{ numeric_type }}), cast(10 as {{ numeric_type }}), cast(null as {{ string_type }}), cast(null as {{ string_type }}), cast(null as {{ string_type }}), cast(null as {{ string_type }}), cast(null as {{ string_type }})
          union all
          select 'missing-end-claim', 2, 'professional', cast('2024-03-03' as date), cast(null as date), 'person-1|source-a', 'source-a', cast(10 as {{ numeric_type }}), cast(10 as {{ numeric_type }}), cast(10 as {{ numeric_type }}), cast(null as {{ string_type }}), cast(null as {{ string_type }}), cast(null as {{ string_type }}), cast(null as {{ string_type }}), cast(null as {{ string_type }})
          union all
          select 'reversed-dates-claim', 1, 'professional', cast('2024-04-05' as date), cast('2024-04-01' as date), 'person-1|source-a', 'source-a', cast(10 as {{ numeric_type }}), cast(10 as {{ numeric_type }}), cast(10 as {{ numeric_type }}), cast(null as {{ string_type }}), cast(null as {{ string_type }}), cast(null as {{ string_type }}), cast(null as {{ string_type }}), cast(null as {{ string_type }})
      - input: ref('encounters__orphaned_claims')
        format: sql
        rows: |
          select
              'multi-day-claim' as claim_id
            , 1 as claim_line_number
            , 'source-a' as data_source
            , 'orphan-multi-day' as encounter_id
            , 'orphaned claim' as encounter_type
            , 'other' as encounter_group
          union all
          select 'multi-line-claim', 1, 'source-a', 'orphan-multi-line', 'orphaned claim', 'other'
          union all
          select 'multi-line-claim', 2, 'source-a', 'orphan-multi-line', 'orphaned claim', 'other'
          union all
          select 'missing-end-claim', 1, 'source-a', 'orphan-missing-end', 'orphaned claim', 'other'
          union all
          select 'missing-end-claim', 2, 'source-a', 'orphan-missing-end', 'orphaned claim', 'other'
          union all
          select 'reversed-dates-claim', 1, 'source-a', 'orphan-reversed-dates', 'orphaned claim', 'other'
      - input: ref('encounters__stg_eligibility')
        format: sql
        rows: |
          select
              'person-1|source-a' as patient_data_source_id
            , cast('1960-01-01' as date) as birth_date
            , 'female' as sex
            , 'white' as race
            , 1 as patient_row_num
      - input: ref('service_category__service_category_grouper')
        format: sql
        rows: |
          {% set string_type = 'string' if target.type in ['bigquery', 'databricks'] else 'varchar' %}
          {% set integer_type = 'int64' if target.type == 'bigquery' else 'bigint' %}
          select
              cast(null as {{ string_type }}) as claim_id
            , cast(null as {{ integer_type }}) as claim_line_number
            , cast(null as {{ string_type }}) as data_source
            , cast(null as {{ string_type }}) as service_category_2
          from (select 1 as _tuva_empty_fixture) as _tuva_empty_fixture where 1 = 0
      - input: ref('provider_data__provider')
        format: sql
        rows: |
          {% set string_type = 'string' if target.type in ['bigquery', 'databricks'] else 'varchar' %}
          select
              cast(null as {{ string_type }}) as npi
            , cast(null as {{ string_type }}) as provider_organization_name
            , cast(null as {{ string_type }}) as primary_specialty_description
          from (select 1 as _tuva_empty_fixture) as _tuva_empty_fixture where 1 = 0
      - input: ref('terminology__icd_10_cm')
        format: sql
        rows: |
          {% set string_type = 'string' if target.type in ['bigquery', 'databricks'] else 'varchar' %}
          select
              cast(null as {{ string_type }}) as icd_10_cm
            , cast(null as {{ string_type }}) as long_description
          from (select 1 as _tuva_empty_fixture) as _tuva_empty_fixture where 1 = 0
      - input: ref('terminology__icd_9_cm')
        format: sql
        rows: |
          {% set string_type = 'string' if target.type in ['bigquery', 'databricks'] else 'varchar' %}
          select
              cast(null as {{ string_type }}) as icd_9_cm
            , cast(null as {{ string_type }}) as long_description
          from (select 1 as _tuva_empty_fixture) as _tuva_empty_fixture where 1 = 0
    expect:
      rows:
        - encounter_id: orphan-multi-day
          encounter_start_date: 2024-01-01
          encounter_end_date: 2024-01-10
          claim_count: 1
        - encounter_id: orphan-multi-line
          encounter_start_date: 2024-02-01
          encounter_end_date: 2024-02-04
          claim_count: 1
        - encounter_id: orphan-missing-end
          encounter_start_date: 2024-03-01
          encounter_end_date: 2024-03-03
          claim_count: 1
        - encounter_id: orphan-reversed-dates
          encounter_start_date: 2024-04-05
          encounter_end_date: 2024-04-05
          claim_count: 1
