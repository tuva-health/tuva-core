models:
  #final
  - name: service_category__service_category_grouper
    description: |-
      Assigns each contract-valid medical claim line to a service category.
      Professional and institutional claims use the service-category
      algorithms. Claims whose claim_type is undetermined are retained with
      other/other/other because their billing form cannot be classified
      reliably. Null and invalid claim_type values remain outside this model
      and are reported by Logical Data Quality checks.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_claims_preprocessing
        {% else %}claims_preprocessing{%- endif -%}
      alias: service_category_grouper
      materialized: table
      tags:
        - service_category_grouper
        - claims_preprocessing
    columns:
      - name: claim_id
        description: Unique identifier for each claim.
        config:
          meta:
            data_type: varchar
      - name: claim_line_number
        description: Indicates the line number for the particular line of the claim.
        config:
          meta:
            data_type: integer
      - name: claim_type
        description: Indicated the type of claims
        config:
          meta:
            data_type: varchar
      - name: service_category_1
        description: The first service category of the claim line
        config:
          meta:
            data_type: varchar
      - name: service_category_2
        description: The second, more specific service category of the claim line
        config:
          meta:
            data_type: varchar
      - name: service_category_3
        description: The third, even more specific service category of the claim line.
        config:
          meta:
            data_type: varchar
      - name: original_service_cat_2
        description: Original categorization of service category 2 before any
          transformation or normalization.
        config:
          meta:
            data_type: varchar
      - name: original_service_cat_3
        description: Original categorization of service category 3 before any
          transformation or normalization.
        config:
          meta:
            data_type: varchar
      - name: duplicate_row_number
        description: Row number used to identify duplicate entries within the data set.
        config:
          meta:
            data_type: integer
      - name: ccs_category
        description: Clinical Classifications Software category associated with the
          service provided.
        config:
          meta:
            data_type: varchar
      - name: ccs_category_description
        description: Description of the Clinical Classifications Software category.
        config:
          meta:
            data_type: varchar
      - name: drg_code
        description: Medicare Severity Diagnosis Related Group code related to the claim.
        config:
          meta:
            data_type: varchar
      - name: drg_description
        description: Description of the Medicare Severity Diagnosis Related Group code.
        config:
          meta:
            data_type: varchar
      - name: place_of_service_code
        description: Code that identifies the place where service was provided.
        config:
          meta:
            data_type: varchar
      - name: place_of_service_description
        description: Description of the place where service was provided.
        config:
          meta:
            data_type: varchar
      - name: revenue_center_code
        description: Revenue center code associated with the financial aspects of the
          care provided.
        config:
          meta:
            data_type: varchar
      - name: revenue_center_description
        description: Description of the revenue center code.
        config:
          meta:
            data_type: varchar
      - name: hcpcs_code
        description: Healthcare Common Procedure Coding System code that identifies
          specific services provided.
        config:
          meta:
            data_type: varchar
      - name: default_ccsr_category_ip
        description: Default Clinical Classifications Software for Services and
          Procedures category for inpatient services.
        config:
          meta:
            data_type: varchar
      - name: default_ccsr_category_op
        description: Default Clinical Classifications Software for Services and
          Procedures category for outpatient services.
        config:
          meta:
            data_type: varchar
      - name: default_ccsr_category_description_ip
        description: Description of the default CCS for Services and Procedures category
          for inpatient.
        config:
          meta:
            data_type: varchar
      - name: default_ccsr_category_description_op
        description: Description of the default CCS for Services and Procedures category
          for outpatient.
        config:
          meta:
            data_type: varchar
      - name: primary_taxonomy_code
        description: Taxonomy code that classifies the providers type or specialization.
        config:
          meta:
            data_type: varchar
      - name: primary_specialty_description
        description: Description of the providers primary specialty.
        config:
          meta:
            data_type: varchar
      - name: modality
        description: The type of modality used in the service provided.
        config:
          meta:
            data_type: varchar
      - name: bill_type_code
        description: Code that identifies the type of bill submitted for the claim.
        config:
          meta:
            data_type: varchar
      - name: bill_type_description
        description: Description of the bill type code.
        config:
          meta:
            data_type: varchar
      - name: source_model_name
        description: Name of the source model from which this data was derived.
        config:
          meta:
            data_type: varchar
      - name: data_source
        description: The original source of the data used in this model.
        config:
          meta:
            data_type: varchar

  #intermediate:
  - name: int_claim_level_diagnosis
    description: |
      Creates one claim-level diagnosis array per claim_id and data_source for downstream claims-preprocessing algorithms that require a single diagnosis value per diagnosis position. This model uses normalized__medical_claim_diagnoses and intentionally preserves the legacy max() behavior used by service categories and encounters. Undetermined claims remain outside this algorithm-specific aggregate so restoring their canonical diagnosis facts does not replace line-level values with an arbitrary claim-level max().
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_claims_preprocessing
        {% else %}claims_preprocessing{%- endif -%}
      alias: int_claim_level_diagnosis
      materialized: table
      tags:
        - service_category_grouper_base
        - claims_preprocessing
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - claim_id
              - data_source
    columns:
      - name: claim_id
        description: Source claim identifier from input_layer__medical_claim.
        tests:
          - not_null
      - name: data_source
        description: Data source associated with the claim.
        tests:
          - not_null
      - name: diagnosis_code_type
        description: Claim-level diagnosis code system selected from diagnosis rows for the claim.
      - name: diagnosis_code_1
        description: Claim-level diagnosis code in position 1 selected with legacy max() behavior.
      - name: diagnosis_code_2
        description: Claim-level diagnosis code in position 2 selected with legacy max() behavior.
      - name: diagnosis_code_3
        description: Claim-level diagnosis code in position 3 selected with legacy max() behavior.
      - name: diagnosis_code_4
        description: Claim-level diagnosis code in position 4 selected with legacy max() behavior.
      - name: diagnosis_code_5
        description: Claim-level diagnosis code in position 5 selected with legacy max() behavior.
      - name: diagnosis_code_6
        description: Claim-level diagnosis code in position 6 selected with legacy max() behavior.
      - name: diagnosis_code_7
        description: Claim-level diagnosis code in position 7 selected with legacy max() behavior.
      - name: diagnosis_code_8
        description: Claim-level diagnosis code in position 8 selected with legacy max() behavior.
      - name: diagnosis_code_9
        description: Claim-level diagnosis code in position 9 selected with legacy max() behavior.
      - name: diagnosis_code_10
        description: Claim-level diagnosis code in position 10 selected with legacy max() behavior.
      - name: diagnosis_code_11
        description: Claim-level diagnosis code in position 11 selected with legacy max() behavior.
      - name: diagnosis_code_12
        description: Claim-level diagnosis code in position 12 selected with legacy max() behavior.
      - name: diagnosis_code_13
        description: Claim-level diagnosis code in position 13 selected with legacy max() behavior.
      - name: diagnosis_code_14
        description: Claim-level diagnosis code in position 14 selected with legacy max() behavior.
      - name: diagnosis_code_15
        description: Claim-level diagnosis code in position 15 selected with legacy max() behavior.
      - name: diagnosis_code_16
        description: Claim-level diagnosis code in position 16 selected with legacy max() behavior.
      - name: diagnosis_code_17
        description: Claim-level diagnosis code in position 17 selected with legacy max() behavior.
      - name: diagnosis_code_18
        description: Claim-level diagnosis code in position 18 selected with legacy max() behavior.
      - name: diagnosis_code_19
        description: Claim-level diagnosis code in position 19 selected with legacy max() behavior.
      - name: diagnosis_code_20
        description: Claim-level diagnosis code in position 20 selected with legacy max() behavior.
      - name: diagnosis_code_21
        description: Claim-level diagnosis code in position 21 selected with legacy max() behavior.
      - name: diagnosis_code_22
        description: Claim-level diagnosis code in position 22 selected with legacy max() behavior.
      - name: diagnosis_code_23
        description: Claim-level diagnosis code in position 23 selected with legacy max() behavior.
      - name: diagnosis_code_24
        description: Claim-level diagnosis code in position 24 selected with legacy max() behavior.
      - name: diagnosis_code_25
        description: Claim-level diagnosis code in position 25 selected with legacy max() behavior.
      - name: tuva_last_run
        description: Timestamp value from the tuva_last_run dbt variable for the current dbt invocation.

