  - name: test_core_utilization_preserves_member_month_id
    description: >-
      Verifies that Core utilization preserves the member-month key while
      calculating claim-sourced encounter counts.
    model: core__utilization
    config:
      enabled: "{{ var('claims_enabled', false) | as_bool }}"
    overrides:
      vars:
        claims_enabled: true
        tuva_last_run: '2024-02-01 00:00:00'
    given:
      - input: ref('core__member_month')
        rows:
          - member_month_id: member-month-1
            person_id: person-1
            member_id: member-1
            year_month: '202401'
            payer: payer-1
            plan: plan-1
            data_source: source-1
      - input: ref('core__encounter')
        rows:
          - person_id: person-1
            encounter_start_date: '2024-01-15'
            encounter_group: inpatient
            encounter_type: acute inpatient
            encounter_source_type: claim
            data_source: source-1
    expect:
      rows:
        - member_month_id: member-month-1
          total_encounter_count: 1
          inpatient_count: 1
          acute_inpatient_count: 1
          data_source: source-1

  - name: test_int_cost_service_categories_uses_line_start_for_claim_month
    description: >-
      Cross-month claim lines must allocate cost to the same month that claims
      enrollment flagging assigns them to. Regression test for #1140: cost
      previously used coalesce(claim_start_date, claim_end_date) while
      enrollment used the line start date, so a line with a February line
      start and a January claim start was enrolled in February while its spend
      was reported in January. With February-only coverage the spend was
      silently dropped from Core cost.
    model: int_cost_service_categories
    config:
      enabled: "{{ var('claims_enabled', false) | as_bool }}"
    overrides:
      vars:
        claims_enabled: true
        tuva_last_run: '2024-02-01 00:00:00'
    given:
      - input: ref('core__medical_claim')
        format: sql
        rows: |
          {% set plan_identifier = '[plan]' if target.type in ['fabric', 'sqlserver'] else '`plan`' if target.type == 'bigquery' else 'plan' %}
          select
              'person-1' as person_id
            , 'member-1' as member_id
            , 'payer-1' as payer
            , 'plan-1' as {{ plan_identifier }}
            , 'source-1' as data_source
            , cast('2024-02-02' as date) as claim_line_start_date
            , cast('2024-01-31' as date) as claim_start_date
            , cast(null as date) as admission_date
            , cast('2024-02-03' as date) as claim_end_date
            , 'outpatient' as service_category_1
            , 'outpatient hospital or clinic' as service_category_2
            , 100 as paid_amount
            , 200 as allowed_amount
      - input: ref('core__pharmacy_claim')
        format: sql
        rows: |
          {% set string_type = 'string' if target.type in ['bigquery', 'databricks'] else 'varchar' %}
          {% set numeric_type = 'numeric' %}
          {% set plan_identifier = '[plan]' if target.type in ['fabric', 'sqlserver'] else '`plan`' if target.type == 'bigquery' else 'plan' %}
          select
              cast(null as {{ string_type }}) as person_id
            , cast(null as {{ string_type }}) as member_id
            , cast(null as {{ string_type }}) as payer
            , cast(null as {{ string_type }}) as {{ plan_identifier }}
            , cast(null as {{ string_type }}) as data_source
            , cast(null as date) as dispensing_date
            , cast(null as date) as paid_date
            , cast(null as {{ numeric_type }}) as paid_amount
            , cast(null as {{ numeric_type }}) as allowed_amount
          from (select 1 as _tuva_empty_fixture) as _tuva_empty_fixture
          where 1 = 0
    expect:
      rows:
        - person_id: person-1
          member_id: member-1
          payer: payer-1
          plan: plan-1
          data_source: source-1
          year_month: '202402'
          service_category_1: outpatient
          service_category_2: outpatient hospital or clinic
          total_paid: 100
          total_allowed: 200

  - name: test_int_cost_service_categories_claim_date_fallback_chain
    description: >-
      Locks the shared selected-claim-date contract fallbacks in Core cost:
      admission date is used when no start dates exist, claim end date is the
      final fallback for end-date-only sources, and all-null dates produce a
      null month instead of an arbitrary one.
    model: int_cost_service_categories
    config:
      enabled: "{{ var('claims_enabled', false) | as_bool }}"
    overrides:
      vars:
        claims_enabled: true
        tuva_last_run: '2024-02-01 00:00:00'
    given:
      - input: ref('core__medical_claim')
        format: sql
        rows: |
          {% set plan_identifier = '[plan]' if target.type in ['fabric', 'sqlserver'] else '`plan`' if target.type == 'bigquery' else 'plan' %}
          select
              'person-2' as person_id
            , 'member-2' as member_id
            , 'payer-1' as payer
            , 'plan-1' as {{ plan_identifier }}
            , 'source-1' as data_source
            , cast(null as date) as claim_line_start_date
            , cast(null as date) as claim_start_date
            , cast('2024-04-10' as date) as admission_date
            , cast(null as date) as claim_end_date
            , 'outpatient' as service_category_1
            , 'outpatient hospital or clinic' as service_category_2
            , 50 as paid_amount
            , 60 as allowed_amount
          union all
          select
              'person-3' as person_id
            , 'member-3' as member_id
            , 'payer-1' as payer
            , 'plan-1' as {{ plan_identifier }}
            , 'source-1' as data_source
            , cast(null as date) as claim_line_start_date
            , cast(null as date) as claim_start_date
            , cast(null as date) as admission_date
            , cast('2024-03-15' as date) as claim_end_date
            , 'outpatient' as service_category_1
            , 'outpatient hospital or clinic' as service_category_2
            , 70 as paid_amount
            , 80 as allowed_amount
          union all
          select
              'person-4' as person_id
            , 'member-4' as member_id
            , 'payer-1' as payer
            , 'plan-1' as {{ plan_identifier }}
            , 'source-1' as data_source
            , cast(null as date) as claim_line_start_date
            , cast(null as date) as claim_start_date
            , cast(null as date) as admission_date
            , cast(null as date) as claim_end_date
            , 'outpatient' as service_category_1
            , 'outpatient hospital or clinic' as service_category_2
            , 90 as paid_amount
            , 95 as allowed_amount
      - input: ref('core__pharmacy_claim')
        format: sql
        rows: |
          {% set string_type = 'string' if target.type in ['bigquery', 'databricks'] else 'varchar' %}
          {% set numeric_type = 'numeric' %}
          {% set plan_identifier = '[plan]' if target.type in ['fabric', 'sqlserver'] else '`plan`' if target.type == 'bigquery' else 'plan' %}
          select
              cast(null as {{ string_type }}) as person_id
            , cast(null as {{ string_type }}) as member_id
            , cast(null as {{ string_type }}) as payer
            , cast(null as {{ string_type }}) as {{ plan_identifier }}
            , cast(null as {{ string_type }}) as data_source
            , cast(null as date) as dispensing_date
            , cast(null as date) as paid_date
            , cast(null as {{ numeric_type }}) as paid_amount
            , cast(null as {{ numeric_type }}) as allowed_amount
          from (select 1 as _tuva_empty_fixture) as _tuva_empty_fixture
          where 1 = 0
    expect:
      rows:
        - person_id: person-2
          year_month: '202404'
          total_paid: 50
        - person_id: person-3
          year_month: '202403'
          total_paid: 70
        - person_id: person-4
          year_month:
          total_paid: 90

