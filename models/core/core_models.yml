version: 2
models:
  - name: core__appointment
    description: |-
      The appointment table stores scheduling information for clinical appointments, including scheduled, completed, canceled, and no-show appointments when those records are available from the source system. Appointments may be linked to an encounter when the appointment resulted in a clinical visit, but not every appointment will have an encounter_id.

      This model transforms the input layer by:
      1. Casting every appointment field to its core data type
      2. Preserving source-EHR appointment type, status, reason, and cancellation reason descriptions without terminology normalization
      3. Pulling through extension columns from input_layer.appointment

      Table grain: One record per appointment per patient per data source.

      Primary key: appointment_id, data_source.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - appointment_id
              - data_source
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_core
        {% else %}core{%- endif -%}
      alias: appointment
      meta:
        dag:
          node_type: output
      tags: core
      materialized: table
    columns:
      - name: appointment_id
        description: Identifier for an appointment within a data source. This value
          should identify the appointment when combined with data_source.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: person_id
        description: Globally unique identifier for the person associated with the
          appointment. A person may have multiple patient IDs over time or
          across clinical source systems, but person_id should remain stable for
          the same person.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
      - name: patient_id
        description: Identifier that links the person to a particular clinical source
          system, for example a medical record number or MRN. A single person
          may have multiple patient IDs.
        config:
          meta:
            data_type: varchar
      - name: encounter_id
        description: Identifier for the clinical encounter associated with the
          appointment. Populated when the appointment resulted in, or is linked
          to, a clinical encounter.
        config:
          meta:
            data_type: varchar
      - name: start_datetime
        description: Scheduled start date and time of the appointment. This should
          include both date and time when available.
        config:
          meta:
            data_type: timestamp
      - name: end_datetime
        description: Scheduled end date and time of the appointment. This should be
          greater than or equal to start_datetime when both values are
          populated.
        config:
          meta:
            data_type: timestamp
      - name: duration
        description: Scheduled duration of the appointment in minutes. This may be
          supplied by the source or derived from start_datetime and
          end_datetime.
        config:
          meta:
            data_type: integer
      - name: location_id
        description: Identifier for the location where the appointment is scheduled,
          such as a clinic, department, facility, or site in the source system.
        config:
          meta:
            data_type: varchar
      - name: practitioner_id
        description: Identifier for the practitioner associated with the appointment.
          When multiple practitioners are associated with an appointment, this
          generally represents the primary, scheduled, or rendering practitioner
          from the source system.
        config:
          meta:
            data_type: varchar
      - name: type
        description: Description of the appointment type as represented in the source
          EHR. The source value is preserved without mapping it to a
          Tuva-controlled vocabulary.
        config:
          meta:
            data_type: varchar
      - name: status
        description: Description of the appointment status as represented in the
          source EHR, such as scheduled, completed, canceled, or no-show. The
          source value is preserved without mapping it to a Tuva-controlled
          vocabulary.
        config:
          meta:
            data_type: varchar
      - name: reason
        description: Description of the appointment reason as represented in the
          source EHR. This may represent the patient-stated reason, scheduling
          reason, visit reason, or chief complaint depending on the source system.
        config:
          meta:
            data_type: varchar
      - name: cancellation_reason
        description: Description of the cancellation reason as represented in the
          source EHR. Populated only when the appointment was canceled and the
          source provides a cancellation reason.
        config:
          meta:
            data_type: varchar
      - name: ingest_datetime
        description: Date and time the source appointment record was extracted from the source system or loaded into the data warehouse.
        config:
          meta:
            data_type: timestamp
      - name: tuva_last_run
        description: Timestamp when this dbt invocation started. Defaults to
          `run_started_at` in UTC and can be overridden with the `tuva_last_run`
          variable.
        config:
          meta:
            data_type: timestamp
      - name: data_source
        description: User-defined name that identifies the source of the appointment
          data, for example Epic, Athena Health, or Cerner.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
            is_primary_key: true
  - name: int_condition_from_claims
    description: |
      Creates core-ready claims-derived condition rows from normalized__medical_claim_diagnoses. This model left joins the normalized diagnosis rows to the claims preprocessing encounter claim-line crosswalk to populate encounter_id when available, then creates the collision-safe deterministic Tuva condition_id used by core.condition. Diagnoses remain available when claim_type is undetermined or no encounter is assigned; those rows have a null encounter_id. Claims-derived rows have no source_condition_id, do not infer a clinical status, and use billing_diagnosis as condition_type.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - condition_id
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_intermediate
        {% else %}intermediate{%- endif -%}
      alias: int_condition_from_claims
      tags: core
      materialized: table
    columns:
      - name: condition_id
        description: >-
          Deterministic Tuva identifier created by hashing an unambiguous
          encoding of the claims-condition domain marker, data_source,
          claim_id, encounter_id, condition_rank, code_system, and source_code.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: source_condition_id
        description: >-
          Source clinical condition identifier. This is always null for
          claims-derived rows because medical claims do not supply a source
          condition-record identifier.
        config:
          meta:
            data_type: varchar
      - name: encounter_id
        description: Encounter identifier assigned to the source claim line by the claims preprocessing encounter grouper.
        config:
          meta:
            data_type: varchar
      - name: claim_id
        description: Source claim identifier from normalized__medical_claim_diagnoses.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
      - name: code_system
        description: Diagnosis code system for source_code and normalized_code.
        config:
          meta:
            data_type: varchar
      - name: source_code
        description: Diagnosis code from the source claim after removing decimal formatting.
        config:
          meta:
            data_type: varchar
      - name: normalized_code
        description: Diagnosis code after matching to Tuva terminology.
        config:
          meta:
            data_type: varchar
      - name: status
        description: >-
          Clinical condition status. This is null for claims-derived rows
          because a billed diagnosis does not establish whether a condition is
          clinically active, resolved, or otherwise current.
        config:
          meta:
            data_type: varchar
      - name: condition_type
        description: >-
          Category of condition record. Claims-derived rows use
          billing_diagnosis.
        config:
          meta:
            data_type: varchar
      - name: condition_rank
        description: Integer diagnosis position from the source medical claim.
        config:
          meta:
            data_type: integer
      - name: ingest_datetime
        description: Null for claims-derived condition rows because a Core condition can consolidate diagnoses from multiple claim lines without retaining one source record.
        config:
          meta:
            data_type: timestamp
      - name: data_source
        description: Data source associated with the claim line.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
  - name: int_procedure_from_claims
    description: |-
      Creates core-ready claims-derived procedure rows from normalized__medical_claim_procedures. This model joins normalized procedure rows to the claims preprocessing encounter claim-line crosswalk to populate encounter_id, then creates the collision-safe, domain-separated Tuva synthetic procedure_id used by core.procedure.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - procedure_id
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_intermediate
        {% else %}intermediate{%- endif -%}
      alias: int_procedure_from_claims
      tags: core
      materialized: table
    columns:
      - name: procedure_id
        description: >-
          Deterministic 32-character lowercase Tuva identifier created by
          hashing an unambiguous encoding of the claims-procedure domain,
          source, claim, encounter, procedure sequence, code, procedure date,
          modifiers, and practitioner. Null, empty, sentinel-like, and
          delimiter-bearing values remain distinct.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: encounter_id
        description: Encounter identifier assigned to the source claim line or claim by the claims preprocessing encounter grouper.
        config:
          meta:
            data_type: varchar
      - name: claim_id
        description: Source claim identifier from normalized__medical_claim_procedures.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
      - name: code_system
        description: Procedure code system for source_code and normalized_code.
        config:
          meta:
            data_type: varchar
      - name: source_code
        description: Procedure code from the source claim.
        config:
          meta:
            data_type: varchar
      - name: normalized_code
        description: Procedure code after matching to Tuva terminology.
        config:
          meta:
            data_type: varchar
      - name: ingest_datetime
        description: Date and time the originating medical claim line was loaded into the data warehouse for line-level HCPCS rows. This is null when a claims-derived procedure cannot be tied reliably to one source claim line.
        config:
          meta:
            data_type: timestamp
      - name: data_source
        description: Data source associated with the claim.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
  - name: core__condition
    description: |
      The condition table stores diagnoses and problems from claims and clinical sources. Claims-derived rows come from the diagnosis code columns in input_layer.medical_claim. Clinical rows come from input_layer.condition. The Normalized Layer matches source codes to ICD-10-CM, ICD-9-CM, and SNOMED CT terminology as supported by each source path. core.condition unions normalized clinical and claims condition rows, then applies the Tuva Condition Grouper to supported normalized ICD-10-CM and SNOMED CT codes to populate condition_family and condition.

      All clinical condition records and every populated medical-claim diagnosis position from the enabled Input Layer sources flow through to core.condition, including invalid codes that do not appear in the supported terminology sets. Unmatched codes retain their source_code and have null normalized_code and normalized_description. Claims diagnoses are retained regardless of claim_type or encounter assignment; diagnoses without an encounter assignment have a null encounter_id.

      If a claim has different diagnosis values in the same position across claim lines, all of those values appear in core.condition with the same condition_rank. For example, different values in diagnosis_code_2 each have condition_rank = 2. Repeated claims diagnoses with identical Core output values are collapsed into one row. Diagnoses associated with different encounters remain separate rows.

      Valid retained nonbillable ICD-10-CM headings are mapped because incomplete codes occur in real-world source data. Mapping status is independent of terminology lifecycle, so an active mapping still groups a retained historical or deprecated code. Ambiguous active mapping keys fail closed and leave the grouper fields null without multiplying the condition row.

      Primary key: condition_id.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - condition_id
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_core
        {% else %}core{%- endif -%}
      alias: condition
      tags: core
      materialized: table
    columns:
      - name: condition_id
        description: >-
          Collision-safe, deterministic primary key for the condition table.
          Clinical IDs hash data_source and source_condition_id from
          input_layer.condition. Claims-derived IDs hash data_source and
          claim_id from input_layer.medical_claim, the encounter_id assigned
          by Claims Preprocessing, and the condition_rank, code_system, and
          source_code produced from the claim's diagnosis fields by the
          Normalized Layer. Both paths use an unambiguous encoding and a
          distinct clinical or claims domain marker.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: source_condition_id
        description: >-
          Condition-record identifier from the source clinical system. This is
          preserved from input_layer.condition for clinical rows and is null
          for claims-derived rows.
        config:
          meta:
            data_type: varchar
      - name: person_id
        description: Globally unique identifier for the person associated with this
          condition. For claims-derived rows, this comes from
          input_layer.medical_claim. For clinical rows, this comes from
          input_layer.condition.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
      - name: member_id
        description: Payer or health plan member identifier. For claims-derived rows,
          this comes from input_layer.medical_claim. For clinical rows, this is
          null because input_layer.condition does not include a member_id.
        config:
          meta:
            data_type: varchar
      - name: patient_id
        description: Clinical source system patient identifier, such as a medical
          record number. For clinical rows, this comes from
          input_layer.condition. For claims-derived rows, this is null because
          medical claims use member_id rather than patient_id.
        config:
          meta:
            data_type: varchar
      - name: encounter_id
        description: Identifier for the clinical encounter associated with the
          condition. For clinical rows, this comes from input_layer.condition
          when the condition is linked to an encounter. If a condition is not
          linked to an encounter in input_layer.condition then the encounter_id
          field is null. For claims-derived rows, this is populated from the
          selected claim-line encounter assignment in claims preprocessing.
          Different claim lines from a single claim can be assigned to different
          encounters. This means that the same diagnosis code on a claim can be
          assigned to different encounters and will appear in core.condition one
          time for each encounter it is assigned to.
        config:
          meta:
            data_type: varchar
      - name: claim_id
        description: Medical claim identifier associated with the condition. For
          claims-derived rows, this comes from input_layer.medical_claim, which
          supplied the diagnosis code. For clinical rows, this is null because
          claims should not be mapped to input_layer.condition.
        config:
          meta:
            data_type: varchar
      - name: payer
        description: Name of the payer or health insurer. For claims-derived rows, this
          comes from input_layer.medical_claim. For clinical rows, this is null
          because input_layer.condition does not include payer.
        config:
          meta:
            data_type: varchar
      - name: recorded_date
        description: >-
          Date the condition was recorded or documented. For claims-derived
          rows, Tuva uses the first non-null normalized claim date in this
          order: admission_date, claim_start_date, discharge_date, and
          claim_end_date. These dates originate in input_layer.medical_claim.
          For clinical rows, this comes from input_layer.condition.
        config:
          meta:
            data_type: date
      - name: onset_date
        description: Date the condition began or was first clinically present. For
          clinical rows, this comes from input_layer.condition when available.
          For claims-derived rows, this is null.
        config:
          meta:
            data_type: date
      - name: resolved_date
        description: Date the condition resolved or became inactive. For clinical rows,
          this comes from input_layer.condition when available. For
          claims-derived rows, this is null.
        config:
          meta:
            data_type: date
      - name: status
        description: Status of the condition record. For claims-derived rows, this is
          null because a billed diagnosis does not establish clinical status.
          For clinical rows, this comes from input_layer.condition and may
          include values such as active, resolved, inactive, historical,
          suspected, or entered-in-error.
        config:
          meta:
            data_type: varchar
      - name: condition_type
        description: Category of condition record. For claims-derived rows, Tuva sets
          this to billing_diagnosis after unpivoting the diagnosis fields in
          input_layer.medical_claim. For clinical rows, this comes from
          input_layer.condition and may include values such as problem,
          encounter diagnosis, admitting diagnosis, discharge diagnosis, or
          billing diagnosis.
        config:
          meta:
            data_type: varchar
      - name: code_system
        description: Code system for source_code. For claims-derived rows, Tuva uses
          diagnosis_code_type when the code matches the declared ICD system;
          otherwise, it infers the system from terminology matches, preferring
          ICD-10-CM over ICD-9-CM when both match. For clinical rows, Tuva does not
          infer or correct the code system and only searches the declared terminology.
          normalized_code and normalized_description are populated when a terminology
          match is found; otherwise, they remain null. Unmatched rows retain the
          lowercased source code system value. Common values include icd-10-cm,
          icd-9-cm, and snomed-ct.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/code-type
            data_type: varchar
      - name: source_code
        description: Condition code supplied by the source. For claims-derived rows,
          this comes from the unpivoted diagnosis code fields in
          input_layer.medical_claim with decimal points removed. For clinical
          rows, this is preserved from input_layer.condition.source_code.
          Codes are retained even when no terminology match exists.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/icd-10-cm
            terminology_note: '**Note: this terminology set is too large to be loaded as a
              seed and is instead loaded from public cloud storage for supported
              adapters.'
            data_type: varchar
      - name: source_description
        description: Human-readable description of the source condition code or
          condition record. For clinical rows, this comes from
          input_layer.condition when available. For claims-derived rows, this
          is null because descriptions are populated downstream from terminology
          into normalized_description.
        config:
          meta:
            data_type: varchar
      - name: normalized_code
        description: Normalized condition code matched to supported terminology in
          the Normalized Layer. Clinical rows can match ICD-10-CM, ICD-9-CM,
          or SNOMED CT; claims-derived rows can match ICD-10-CM or ICD-9-CM.
          This is null when no supported terminology match exists.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/icd-10-cm
            terminology_note: '**Note: this terminology set is too large to be loaded as a
              seed and is instead loaded from public cloud storage for supported
              adapters.'
            data_type: varchar
      - name: normalized_description
        description: Human-readable terminology description for normalized_code.
          Tuva populates this by matching code_system and source_code to
          supported condition terminology tables in the Normalized Layer.
          Clinical and claims-derived ICD-10-CM and ICD-9-CM rows use the
          terminology long description so the same normalized code has the
          same description across source paths.
        config:
          meta:
            data_type: varchar
      - name: condition_family
        description: Analytic condition family assigned by the Tuva Condition Grouper.
          This is populated when a normalized ICD-10-CM or SNOMED CT code has
          an unambiguous active mapping in tuva_condition_grouper_code_map.
          Historical or deprecated codes can be grouped when an active mapping
          exists. Unmapped or ambiguously mapped codes and unsupported code
          systems, including ICD-9-CM, remain null.
        config:
          meta:
            data_type: varchar
      - name: condition_name
        description: Mutually exclusive condition assigned by the Tuva Condition
          Grouper. A supported normalized code maps to at most one condition
          and one condition family, so the grouper join cannot multiply Core
          condition rows. Only unambiguous active mappings are used, including
          mappings for historical or deprecated codes. Unmapped or ambiguously
          mapped codes and unsupported code systems, including ICD-9-CM,
          remain null.
        config:
          meta:
            data_type: varchar
      - name: condition_rank
        description: The numerical ranking of the condition. For conditions derived from
          input_layer.medical_claim, condition_rank is set from the diagnosis
          code position on the claim, so diagnosis_code_1 becomes condition_rank = 1,
          diagnosis_code_2 becomes condition_rank = 2, and so on through
          diagnosis_code_25. Different diagnosis values in the same position
          across claim lines retain the same rank. For conditions sourced from
          input_layer.condition, the mapped input value is preserved as an
          integer. A condition_rank of 1 indicates a primary diagnosis code,
          and any condition_rank greater than 1 indicates a
          secondary diagnosis code.
        config:
          meta:
            data_type: integer
      - name: present_on_admit_code
        description: Present-on-admission indicator for the condition, when applicable.
          For claims-derived rows, this comes from the diagnosis_poa field in
          input_layer.medical_claim at the matching diagnosis position. For
          clinical rows, this comes from input_layer.condition. This is most
          relevant for inpatient facility diagnoses.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/present-on-admission
            data_type: varchar
      - name: present_on_admit_description
        description: Description of present_on_admit_code, derived from
          terminology.present_on_admission.
        config:
          meta:
            data_type: varchar
      - name: ingest_datetime
        description: Date and time the source record was loaded into the data warehouse.
          For clinical rows, this is preserved from
          input_layer.condition.ingest_datetime. This is always null for
          claims-derived rows in the current implementation because repeated
          diagnoses can collapse across input_layer.medical_claim lines with
          different ingest timestamps, and Core condition does not retain a
          source claim-line identifier.
        config:
          meta:
            data_type: timestamp
      - name: tuva_last_run
        description: Timestamp when this dbt invocation started. Defaults to
          `run_started_at` in UTC and can be overridden with the `tuva_last_run`
          variable.
        config:
          meta:
            data_type: timestamp
      - name: data_source
        description: User-defined name that identifies the source of the condition data,
          for example a claims payer data source or a clinical system such as
          Epic, Athena Health, or Cerner. This comes from
          input_layer.medical_claim for claims-derived rows and
          input_layer.condition for clinical rows.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
  - name: core__eligibility
    description: |-
      This table stores health insurance eligibility and enrollment spans. It is designed to contain one record per person per enrollment span, where an enrollment span is the period during which a person is enrolled in a health plan. That period begins on enrollment_start_date and ends on enrollment_end_date; a null enrollment_end_date means the span remains open. A person may have multiple records in this table when they have multiple enrollment spans with different health plans or multiple enrollment spans with the same health plan.

      The primary key is eligibility_id, a synthetic key created upstream in normalized__eligibility. The eligibility_id is made from person_id, member_id, enrollment_start_date, payer, plan, and data_source. enrollment_end_date is intentionally excluded so the identifier remains stable when an open span later receives a closing date. This key is created because downstream models, including the semantic layer, need a stable record-level identifier for each eligibility span.

      Each record includes person_id, the globally unique identifier for the person, along with payer, plan, member_id, subscriber_id, enrollment dates, and other health plan enrollment attributes. These attributes include payer type, Medicare entitlement and status fields, dual eligibility status, hospice and institutional enrollment indicators, subscriber relationship, group identifiers, FIPS state fields, source file metadata, and extension columns.

      Primary key: eligibility_id.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_core
        {% else %}core{%- endif -%}
      alias: eligibility
      tags: core
      materialized: table
    columns:
      - name: eligibility_id
        description: Primary key for the eligibility record. This value is created
          upstream in normalized__eligibility by concatenating person_id,
          member_id, enrollment_start_date, payer, plan, and data_source with
          hyphen delimiters. enrollment_end_date is excluded so the key remains
          stable when an open span closes.
        tests:
          - not_null
          - unique
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: person_id
        description: Globally unique identifier for a person across all data sources. A
          person may have multiple member_id or subscriber_id values over time,
          but person_id should remain stable for the same person.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
      - name: member_id
        description: Identifier assigned by the payer or health plan for the person's
          enrollment in a specific insurance product or health plan. A person
          may have more than one member_id when they have more than one
          insurance product, plan, or coverage period.
        config:
          meta:
            data_type: varchar
      - name: subscriber_id
        description: Identifier for the policyholder or primary subscriber through whom
          coverage is obtained. Spouses and dependents may have their own
          person_id and member_id while sharing a subscriber_id.
        config:
          meta:
            data_type: varchar
      - name: subscriber_relation
        description: The person's relationship to the subscriber or policyholder for the
          enrollment span, for example self, spouse, or child.
        config:
          meta:
            data_type: varchar
      - name: enrollment_start_date
        description: Date the person's enrollment span begins.
        config:
          meta:
            data_type: date
      - name: enrollment_end_date
        description: Date the person's enrollment span ends. Null means the span is
          still open. The backward-compatible input alias 9999-12-31 is
          normalized to null before reaching Core.
        config:
          meta:
            data_type: date
      - name: payer
        description: Name of the payer providing coverage for the enrollment span, for
          example Aetna or Blue Cross Blue Shield.
        config:
          meta:
            data_type: varchar
      - name: payer_type
        description: Line of business for the payer. Values should map to Tuva payer
          type terminology, such as commercial, medicaid, medicare, or
          self-insured.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/payer-type
            data_type: varchar
      - name: plan
        description: Name of the specific health insurance product for the enrollment
          span, for example Aetna PPO or Aetna HMO. A given payer may offer
          multiple plans.
        config:
          meta:
            data_type: varchar
      - name: birth_date
        description: Birth date of the person.
        config:
          meta:
            data_type: date
      - name: death_date
        description: Date the person died, when available.
        config:
          meta:
            data_type: date
      - name: original_reason_entitlement_code
        description: Medicare Original Reason for Entitlement Code, or OREC. This
          single-character code identifies the original reason the person became
          eligible for Medicare and supports CMS-HCC risk adjustment.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/medicare-orec
            data_type: varchar
      - name: dual_status_code
        description: Indicates whether the person is dually eligible for Medicare and
          Medicaid during the enrollment span. This supports CMS-HCC risk
          adjustment.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/medicare-dual-eligibility
            data_type: varchar
      - name: medicare_status_code
        description: Two-character Medicare status code indicating how the person
          currently qualifies for Medicare. This is used in CMS-HCC risk
          adjustment when original_reason_entitlement_code is not available.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/medicare-status
            data_type: varchar
      - name: enrollment_status
        description: Enrollment status used to determine CMS-HCC risk score
          coefficients. Leave null when unknown so Tuva can infer enrollment
          status from other available eligibility fields.
        config:
          meta:
            data_type: varchar
      - name: hospice_flag
        description: Indicator for whether the person is enrolled in hospice during the
          enrollment span. Accepted values are 0 and 1.
        config:
          meta:
            data_type: integer
      - name: institutional_snp_flag
        description: Indicator for whether the person is enrolled in an institutional
          Special Needs Plan and requires a nursing-home level of care. Accepted
          values are 0 and 1.
        config:
          meta:
            data_type: integer
      - name: medicaid_indicator
        description: Indicator for whether the person has Medicaid coverage during the
          enrollment span. Accepted values are 0 and 1.
        config:
          meta:
            data_type: integer
      - name: long_term_institutional_flag
        description: Indicator for whether the person has been in an institutional
          setting for more than 30 days. Accepted values are 0 and 1.
        config:
          meta:
            data_type: integer
      - name: part_d_raf_type
        description: Medicare Part D risk adjustment factor type for the enrollment
          span. Null when the record is not related to Part D coverage.
        config:
          meta:
            data_type: varchar
      - name: low_income_subsidy_indicator
        description: Indicator for Low Income Subsidy, also known as Extra Help, during
          the enrollment span. Null when not applicable.
        config:
          meta:
            data_type: integer
      - name: metal_level
        description: ACA exchange metal tier for the health plan, if applicable. Null
          when the enrollment span is not related to ACA exchange coverage.
        config:
          meta:
            data_type: varchar
      - name: csr_indicator
        description: Cost Sharing Reduction, or CSR, variant indicator for ACA exchange
          coverage. Null when not applicable.
        config:
          meta:
            data_type: integer
      - name: enrollment_duration_months
        description: Number of months covered during the benefit year for ACA exchange
          enrollment. Null when not applicable.
        config:
          meta:
            data_type: integer
      - name: esrd_status
        description: Indicator for end-stage renal disease status. Most commonly
          available with Medicare eligibility. Null when not applicable.
        config:
          meta:
            data_type: integer
      - name: transplant_duration_months
        description: Number of months since kidney transplant, if applicable. Most
          commonly available with Medicare eligibility data.
        config:
          meta:
            data_type: integer
      - name: group_id
        description: Identifier for the employer group or plan group associated with the
          enrollment span. Null when not applicable.
        config:
          meta:
            data_type: varchar
      - name: group_name
        description: Name of the employer group or plan group associated with group_id.
          Null when not applicable.
        config:
          meta:
            data_type: varchar
      - name: fips_state_name
        description: ANSI/FIPS state name matched from the source state value in
          normalized eligibility.
        config:
          meta:
            data_type: varchar
      - name: fips_state_code
        description: ANSI/FIPS state code matched from the source state value in
          normalized eligibility.
        config:
          meta:
            data_type: varchar
      - name: fips_state_abbreviation
        description: ANSI/FIPS state abbreviation matched from the source state value in
          normalized eligibility.
        config:
          meta:
            data_type: varchar
      - name: file_date
        description: Date the source file identified by file_name was delivered,
          formatted as YYYY-MM-DD when serialized.
        config:
          meta:
            data_type: date
      - name: ingest_datetime
        description: Date and time the source eligibility record or file was loaded into
          the data warehouse. This is useful when multiple versions of the same
          source record are received over time.
        config:
          meta:
            data_type: timestamp
      - name: file_name
        description: Name of the source file from which the eligibility record
          originated. This field is useful for tracing source records across
          file-based eligibility extracts.
        config:
          meta:
            data_type: varchar
      - name: tuva_last_run
        description: Timestamp when this dbt invocation started. Defaults to
          `run_started_at` in UTC and can be overridden with the `tuva_last_run`
          variable.
        config:
          meta:
            data_type: timestamp
      - name: data_source
        description: User-defined name that identifies the source of the eligibility
          data, for example BCBS Tennessee, Medicare FFS, or Medicaid Ohio.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
  - name: core__encounter
    description: |-
      The encounter table stores patient visits from claims and clinical sources, including acute inpatient stays, emergency department visits, office visits, skilled nursing facility stays, and other encounters. Claims-derived encounters are created from medical claims and claims preprocessing logic. Clinical encounters are pulled from input_layer.encounter when clinical data is enabled.

      This model standardizes encounter fields from claims and clinical sources, calculates length_of_stay from encounter_start_date and encounter_end_date, enriches admit source, admit type, discharge disposition, primary diagnosis, and DRG descriptions from Tuva terminology, and pulls through clinical extension columns when clinical data is enabled.

      Primary key: encounter_id, data_source.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - encounter_id
              - data_source
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_core
        {% else %}core{%- endif -%}
      alias: encounter
      tags:
        - core
        - encounters
      materialized: table
    columns:
      - name: encounter_id
        description: Identifier for an encounter within a data source.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: person_id
        description: Globally unique identifier for the person associated with the
          encounter.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
      - name: encounter_type
        description: Type of encounter, such as acute inpatient, emergency department,
          outpatient, office visit, or skilled nursing facility. Values should
          map to Tuva encounter type terminology.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/encounter-type
            data_type: varchar
      - name: encounter_group
        description: Higher-level grouping of encounter_type used for utilization and
          reporting.
        config:
          meta:
            data_type: varchar
      - name: encounter_start_date
        description: Date the encounter started. For inpatient and multi-day encounters,
          this is the admission or first service date.
        config:
          meta:
            data_type: date
      - name: encounter_end_date
        description: Date the encounter ended. For inpatient and multi-day encounters,
          this is the discharge or last service date.
        config:
          meta:
            data_type: date
      - name: length_of_stay
        description: Length of the encounter in days, calculated from
          encounter_start_date and encounter_end_date. Same-day encounters are
          assigned a length of stay of 1.
        config:
          meta:
            data_type: integer
      - name: admit_source_code
        description: Code indicating where the patient was immediately before admission,
          when available. This is most relevant for inpatient encounters.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/admit-source
            data_type: varchar
      - name: admit_source_description
        description: Description of admit_source_code, derived from Tuva admit source
          terminology.
        config:
          meta:
            data_type: varchar
      - name: admit_type_code
        description: Code indicating the type or priority of admission, when available.
          This is most relevant for inpatient encounters.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/admit-type
            data_type: varchar
      - name: admit_type_description
        description: Description of admit_type_code, derived from Tuva admit type
          terminology.
        config:
          meta:
            data_type: varchar
      - name: discharge_disposition_code
        description: Code indicating the patient's disposition at discharge, such as
          home, expired, or transferred to another care setting.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/discharge-disposition
            data_type: varchar
      - name: discharge_disposition_description
        description: Description of discharge_disposition_code, derived from Tuva
          discharge disposition terminology.
        config:
          meta:
            data_type: varchar
      - name: attending_provider_id
        description: ID for the attending provider on the encounter. This may be the
          provider's National Provider Identifier (NPI) or a source-system
          provider identifier.
        config:
          meta:
            data_type: varchar
      - name: attending_provider_name
        description: Name of the attending provider associated with the encounter, when
          available.
        config:
          meta:
            data_type: varchar
      - name: facility_npi
        description: National Provider Identifier for the facility where the encounter
          occurred, when available.
        config:
          meta:
            data_type: varchar
      - name: facility_name
        description: Name of the facility or care site where the encounter occurred,
          when available.
        config:
          meta:
            data_type: varchar
      - name: facility_type
        description: Type or category of facility, for example acute care hospital,
          emergency department, or skilled nursing facility.
        config:
          meta:
            data_type: varchar
      - name: observation_flag
        description: Indicates whether the encounter was marked as an observation stay
          (1 for yes, 0 for no).
        config:
          meta:
            data_type: integer
      - name: lab_flag
        description: Indicates whether lab services were utilized during the encounter
          (1 for yes, 0 for no).
        config:
          meta:
            data_type: integer
      - name: dme_flag
        description: Indicates whether durable medical equipment (DME) was used during
          the encounter (1 for yes, 0 for no).
        config:
          meta:
            data_type: integer
      - name: ambulance_flag
        description: Indicates whether ambulance services were utilized during the
          encounter (1 for yes, 0 for no).
        config:
          meta:
            data_type: integer
      - name: pharmacy_flag
        description: Indicates whether pharmacy services were utilized during the
          encounter (1 for yes, 0 for no).
        config:
          meta:
            data_type: integer
      - name: ed_flag
        description: Indicates whether the encounter involved an emergency department
          visit (1 for yes, 0 for no).
        config:
          meta:
            data_type: integer
      - name: delivery_flag
        description: Indicates whether the encounter involved a delivery (1 for yes, 0
          for no).
        config:
          meta:
            data_type: integer
      - name: delivery_type
        description: Type of delivery that occurred during the encounter, if applicable.
        config:
          meta:
            data_type: varchar
      - name: newborn_flag
        description: Indicates whether the encounter was for a newborn (1 for yes, 0 for
          no).
        config:
          meta:
            data_type: integer
      - name: nicu_flag
        description: Indicates whether the newborn was admitted to the Neonatal
          Intensive Care Unit (NICU) during the encounter (1 for yes, 0 for no).
        config:
          meta:
            data_type: integer
      - name: snf_part_b_flag
        description: Indicates whether the inpatient medical service for Medicare covers
          under Part B or not. (1 for yes and 0 for no)
        config:
          meta:
            data_type: integer
      - name: primary_diagnosis_code_type
        description: Code system for primary_diagnosis_code, such as icd-10-cm or icd-9-cm.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/code-type
            data_type: varchar
      - name: primary_diagnosis_code
        description: Primary diagnosis code associated with the encounter, when
          available. For claims-derived encounters, this generally comes from
          the institutional claim.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/icd-10-cm
            terminology_note: '**Note: this terminology set is too large to be loaded as a
              seed and is instead loaded from public cloud storage for supported
              adapters.'
            data_type: varchar
      - name: primary_diagnosis_description
        description: Description of the primary diagnosis code, derived from Tuva ICD
          diagnosis terminology when the code type is icd-10-cm or icd-9-cm.
        config:
          meta:
            data_type: varchar
      - name: drg_code_type
        description: Diagnosis-related group code system for drg_code, when a DRG is
          assigned to the encounter. Examples include ms-drg and apr-drg.
        config:
          meta:
            data_type: varchar
      - name: drg_code
        description: Diagnosis-related group code assigned to the encounter, when
          available. This is most relevant for inpatient encounters.
        config:
          meta:
            data_type: varchar
      - name: drg_description
        description: Description of the DRG code, derived from Tuva MS-DRG or APR-DRG
          terminology.
        config:
          meta:
            data_type: varchar
      - name: paid_amount
        description: Total paid amount associated with the encounter, when available.
          For claims-derived encounters, this is aggregated from medical claim
          lines.
        config:
          meta:
            data_type: number
      - name: allowed_amount
        description: Total allowed amount associated with the encounter, including
          payer-paid and patient-responsibility amounts when available. For
          claims-derived encounters, this is aggregated from medical claim
          lines.
        config:
          meta:
            data_type: number
      - name: charge_amount
        description: Total charge amount associated with the encounter before
          adjustments or payments. For claims-derived encounters, this is
          aggregated from medical claim lines.
        config:
          meta:
            data_type: number
      - name: claim_count
        description: Number of medical claims associated with the encounter. This is
          populated for claims-derived encounters.
        config:
          meta:
            data_type: integer
      - name: inst_claim_count
        description: Number of institutional claims generated from the encounter.
        config:
          meta:
            data_type: integer
      - name: prof_claim_count
        description: Number of professional claims generated from the encounter.
        config:
          meta:
            data_type: integer
      - name: source_model
        description: dbt model or relation from which the encounter row was derived.
        config:
          meta:
            data_type: varchar
      - name: encounter_source_type
        description: Indicates whether the encounter row was derived from claims data or
          clinical data.
        config:
          meta:
            data_type: varchar
      - name: ingest_datetime
        description: Date and time the originating clinical encounter record was loaded into the data warehouse. This is null for claims-derived encounters assembled from multiple source claim lines.
        config:
          meta:
            data_type: timestamp
      - name: tuva_last_run
        description: Timestamp when this dbt invocation started. Defaults to
          `run_started_at` in UTC and can be overridden with the `tuva_last_run`
          variable.
        config:
          meta:
            data_type: timestamp
      - name: data_source
        description: User-defined name that identifies the source of the encounter data,
          for example a claims payer data source or a clinical system such as
          Epic, Athena Health, or Cerner.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
            is_primary_key: true
  - name: core__immunization
    description: |-
      The immunization table stores clinical immunization events from source systems. It includes vaccines administered to patients and, when available, records documenting that an immunization was not performed.

      Tuva normalizes supported source vaccine codes in normalized__immunization by joining source_code_type and source_code to CVX terminology. Status, status reason, body site, and route are also enriched from Tuva terminology when supported source codes are available. Normalized dose is retained for schema compatibility but is not currently populated by Tuva.

      This table is intended to have one record per immunization ID and data source.

      Primary key: immunization_id, data_source.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - immunization_id
              - data_source
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_core
        {% else %}core{%- endif -%}
      alias: immunization
      tags: core
      materialized: table
    columns:
      - name: immunization_id
        description: Identifier for an immunization event within a data source. This
          value should identify the immunization event when combined with
          data_source.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: person_id
        description: Globally unique identifier for the person associated with the
          immunization.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
      - name: patient_id
        description: Identifier that links the person to a particular clinical source
          system, for example a medical record number or MRN.
        config:
          meta:
            data_type: varchar
      - name: encounter_id
        description: Identifier for the encounter associated with the immunization, when
          available.
        config:
          meta:
            data_type: varchar
      - name: source_code_type
        description: Code system for source_code. CVX is preferred when available, but
          local or other source code systems may be present when source data
          cannot provide CVX.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/code-type
            data_type: varchar
      - name: source_code
        description: Vaccine code from the source system. CVX codes are normalized
          automatically by joining to Tuva CVX terminology.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/cvx
            terminology_note: '**Note: this terminology set is too large to be loaded as a
              seed and is instead loaded from public cloud storage for supported
              adapters.'
            data_type: varchar
      - name: source_description
        description: Human-readable description of source_code from the source system.
        config:
          meta:
            data_type: varchar
      - name: normalized_code_type
        description: Normalized vaccine code system. This is set to cvx when
          source_code_type and source_code match Tuva CVX terminology.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/code-type
            data_type: varchar
      - name: normalized_code
        description: Normalized CVX vaccine code derived from Tuva CVX terminology.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/cvx
            terminology_note: '**Note: this terminology set is too large to be loaded as a
              seed and is instead loaded from public cloud storage for supported
              adapters.'
            data_type: varchar
      - name: normalized_description
        description: Human-readable description for normalized_code, populated from Tuva
          CVX terminology.
        config:
          meta:
            data_type: varchar
      - name: status
        description: Immunization event status. When the source status code matches Tuva
          immunization status terminology, this field is populated with the
          terminology status value; otherwise, the source value is retained.
        config:
          meta:
            data_type: varchar
      - name: status_reason
        description: Reason the immunization was not performed, when applicable. When
          the source reason code matches Tuva immunization status reason
          terminology, this field is populated with the terminology description;
          otherwise, the source value is retained.
        config:
          meta:
            data_type: varchar
      - name: occurrence_date
        description: Date the immunization occurred or was documented as not performed.
        config:
          meta:
            data_type: date
      - name: source_dose
        description: Dose quantity or dose text from the source system, when available.
          This field is source-system specific and is not normalized by Tuva.
        config:
          meta:
            data_type: varchar
      - name: normalized_dose
        description: Reserved normalized dose field retained for schema compatibility.
          Tuva does not currently normalize immunization dose, so this field is
          null.
        config:
          meta:
            data_type: varchar
      - name: lot_number
        description: Lot number of the vaccine product administered, when available.
        config:
          meta:
            data_type: varchar
      - name: body_site
        description: Body site where the vaccine was administered. When the source body
          site code matches Tuva act site terminology, this field is populated
          with the terminology description; otherwise, the source value is
          retained.
        config:
          meta:
            data_type: varchar
      - name: route
        description: Route used to administer the vaccine. When the source route code
          matches Tuva immunization route terminology, this field is populated
          with the terminology description; otherwise, the source value is
          retained.
        config:
          meta:
            data_type: varchar
      - name: location_id
        description: Identifier for the location or facility where the immunization was
          administered or documented, when available.
        config:
          meta:
            data_type: varchar
      - name: practitioner_id
        description: Identifier for the practitioner associated with the immunization,
          when available. This may represent the ordering, administering, or
          documenting practitioner depending on the source system.
        config:
          meta:
            data_type: varchar
      - name: ingest_datetime
        description: Date and time the source immunization record was loaded into the data warehouse.
        config:
          meta:
            data_type: timestamp
      - name: tuva_last_run
        description: Timestamp when this dbt invocation started. Defaults to
          `run_started_at` in UTC and can be overridden with the `tuva_last_run`
          variable.
        config:
          meta:
            data_type: timestamp
      - name: data_source
        description: User-defined name that identifies the source of the immunization
          data, for example Epic, Athena Health, or Cerner.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
            is_primary_key: true
  - name: core__lab_result
    description: |-
      The lab_result table stores laboratory test result records from clinical source systems. It includes information about the ordered test or panel, the resulted component or analyte, the result value, result and collection dates, units, reference ranges, abnormal flags, specimen, and ordering practitioner.

      Tuva normalizes supported source order and component codes in normalized__lab_result by joining source_order_type, source_order_code, source_component_type, and source_component_code to LOINC and SNOMED-CT terminology. Normalized units, normalized reference ranges, and normalized abnormal flags are passed through from the input layer when they are populated upstream.

      This table is intended to have one record per lab result ID and data source.

      Primary key: lab_result_id, data_source.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - lab_result_id
              - data_source
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_core
        {% else %}core{%- endif -%}
      alias: lab_result
      tags: core
      materialized: table
    columns:
      - name: lab_result_id
        description: Identifier for a lab result record within a data source. This value
          identifies the lab result when combined with data_source.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: person_id
        description: Globally unique identifier for the person associated with the lab
          result.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
      - name: patient_id
        description: Identifier that links the person to a particular clinical source
          system, for example a medical record number or MRN.
        config:
          meta:
            data_type: varchar
      - name: encounter_id
        description: Identifier for the encounter associated with the lab result, when
          available.
        config:
          meta:
            data_type: varchar
      - name: accession_number
        description: Lab accession number, order number, or specimen tracking identifier
          from the source system.
        config:
          meta:
            data_type: varchar
      - name: source_order_type
        description: Code system for source_order_code. This field describes the ordered
          lab test or panel.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/code-type
            data_type: varchar
      - name: source_order_code
        description: Code for the ordered lab test or panel from the source system.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/loinc
            terminology_note: '**Note: this terminology set is too large to be loaded as a
              seed and is instead loaded from public cloud storage for supported
              adapters.'
            data_type: varchar
      - name: source_order_description
        description: Human-readable description of source_order_code from the source system.
        config:
          meta:
            data_type: varchar
      - name: source_component_type
        description: Code system for source_component_code. This field describes the
          resulted component or analyte.
        config:
          meta:
            data_type: varchar
      - name: source_component_code
        description: Code for the resulted component or analyte from the source system.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/loinc
            terminology_note: '**Note: this terminology set is too large to be loaded as a
              seed and is instead loaded from public cloud storage for supported
              adapters.'
            data_type: varchar
      - name: source_component_description
        description: Human-readable description of source_component_code from the source
          system.
        config:
          meta:
            data_type: varchar
      - name: normalized_order_type
        description: Normalized code system for the ordered lab test or panel. This is
          derived from LOINC or SNOMED-CT terminology.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/code-type
            data_type: varchar
      - name: normalized_order_code
        description: Normalized code for the ordered lab test or panel. This is derived
          from LOINC or SNOMED-CT terminology.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/loinc
            terminology_note: '**Note: this terminology set is too large to be loaded as a
              seed and is instead loaded from public cloud storage for supported
              adapters.'
            data_type: varchar
      - name: normalized_order_description
        description: Human-readable description for normalized_order_code, populated
          from terminology when available.
        config:
          meta:
            data_type: varchar
      - name: normalized_component_type
        description: Normalized code system for the resulted component or analyte. This
          is derived from LOINC or SNOMED-CT terminology.
        config:
          meta:
            data_type: varchar
      - name: normalized_component_code
        description: Normalized code for the resulted component or analyte. This is
          derived from LOINC or SNOMED-CT terminology.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/loinc
            terminology_note: '**Note: this terminology set is too large to be loaded as a
              seed and is instead loaded from public cloud storage for supported
              adapters.'
            data_type: varchar
      - name: normalized_component_description
        description: Human-readable description for normalized_component_code, populated
          from terminology when available.
        config:
          meta:
            data_type: varchar
      - name: status
        description: Source status of the lab result, for example final, preliminary,
          corrected, cancelled, or entered in error.
        config:
          meta:
            data_type: varchar
      - name: result
        description: Result value reported by the source system. This may be numeric,
          coded, or text.
        config:
          meta:
            data_type: varchar
      - name: result_datetime
        description: Date and time the lab result was resulted, reported, or finalized.
        config:
          meta:
            data_type: timestamp
      - name: collection_datetime
        description: Date and time the specimen was collected.
        config:
          meta:
            data_type: timestamp
      - name: source_units
        description: Units for result as reported by the source system.
        config:
          meta:
            data_type: varchar
      - name: normalized_units
        description: Standardized units for result, when available. Tuva passes this
          through from the input layer when it is populated upstream.
        config:
          meta:
            data_type: varchar
      - name: source_reference_range_low
        description: Lower bound of the reference range as reported by the source system.
        config:
          meta:
            data_type: varchar
      - name: source_reference_range_high
        description: Upper bound of the reference range as reported by the source system.
        config:
          meta:
            data_type: varchar
      - name: normalized_reference_range_low
        description: Standardized lower bound of the reference range, when available.
          Tuva passes this through from the input layer when it is populated
          upstream.
        config:
          meta:
            data_type: varchar
      - name: normalized_reference_range_high
        description: Standardized upper bound of the reference range, when available.
          Tuva passes this through from the input layer when it is populated
          upstream.
        config:
          meta:
            data_type: varchar
      - name: source_abnormal_code
        description: Abnormal or interpretation code from the source system.
        config:
          meta:
            data_type: varchar
      - name: normalized_abnormal_code
        description: Standardized abnormal or interpretation code, when available. Tuva
          passes this through from the input layer when it is populated
          upstream.
        config:
          meta:
            data_type: varchar
      - name: specimen
        description: Specimen type for the lab result, for example blood, serum, plasma,
          or urine.
        config:
          meta:
            data_type: varchar
      - name: ordering_practitioner_id
        description: Identifier for the practitioner who ordered the lab test, when
          available. This may be an NPI or a source system practitioner ID.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/provider
            terminology_note: '**Note: this terminology set is too large to be loaded as a
              seed and is instead loaded from public cloud storage for supported
              adapters.'
            data_type: varchar
      - name: ingest_datetime
        description: Date and time the source lab result record was loaded into the data warehouse.
        config:
          meta:
            data_type: timestamp
      - name: tuva_last_run
        description: Timestamp when this dbt invocation started. Defaults to
          `run_started_at` in UTC and can be overridden with the `tuva_last_run`
          variable.
        config:
          meta:
            data_type: timestamp
      - name: data_source
        description: User-defined name that identifies the source of the lab result
          data, for example Epic, Athena Health, or Cerner.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
            is_primary_key: true
  - name: core__location
    description: |-
      The location table contains information about physical locations where clinical care is delivered, documented, or managed. A location may represent a facility, clinic, department, practice site, laboratory, imaging center, or other service location.

      When clinical data is enabled, this table pulls location records from input_layer.location. When claims data is enabled, Tuva derives one organization location per NPI and claims data source from provider data for organization NPIs that appear on medical or pharmacy claims. When both paths produce the same location_id and data_source, the clinical record takes precedence. Clinical extension columns are pulled through when clinical data is enabled.

      Primary key: location_id, data_source.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - location_id
              - data_source
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_core
        {% else %}core{%- endif -%}
      alias: location
      tags: core
      materialized: table
    columns:
      - name: location_id
        description: Identifier for a location. For clinical locations, this is the
          source system location identifier. For claims-derived organization
          locations, this is the organization NPI.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: npi
        description: National Provider Identifier associated with the location, when
          available. For facilities or organizations, this should generally be
          an organization NPI rather than an individual practitioner NPI.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/provider
            terminology_note: '**Note: this terminology set is too large to be loaded as a
              seed and is instead loaded from public cloud storage for supported
              adapters.'
            data_type: varchar
      - name: name
        description: Name of the location.
        config:
          meta:
            data_type: varchar
      - name: facility_type
        description: Type or category of location, for example hospital, clinic,
          emergency department, ambulatory surgery center, laboratory, imaging
          center, or department.
        config:
          meta:
            data_type: varchar
      - name: parent_organization
        description: Organization, health system, practice group, or parent facility
          associated with the location, when available.
        config:
          meta:
            data_type: varchar
      - name: address
        description: Street address of the location.
        config:
          meta:
            data_type: varchar
      - name: city
        description: City of the location.
        config:
          meta:
            data_type: varchar
      - name: state
        description: State of the location.
        config:
          meta:
            data_type: varchar
      - name: zip_code
        description: ZIP code or postal code of the location.
        config:
          meta:
            data_type: varchar
      - name: latitude
        description: Latitude of the location in decimal degrees, when available.
        config:
          meta:
            data_type: float
      - name: longitude
        description: Longitude of the location in decimal degrees, when available.
        config:
          meta:
            data_type: float
      - name: ingest_datetime
        description: Date and time the originating clinical location record was loaded into the data warehouse. This is null for claims-derived locations assembled from provider and claim data.
        config:
          meta:
            data_type: timestamp
      - name: tuva_last_run
        description: Timestamp when this dbt invocation started. Defaults to
          `run_started_at` in UTC and can be overridden with the `tuva_last_run`
          variable.
        config:
          meta:
            data_type: timestamp
      - name: data_source
        description: User-defined name that identifies the clinical or claims source
          system from which the location was derived. Claims-derived organization
          locations retain the data source of the medical or pharmacy claim.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
            is_primary_key: true
  - name: core__medical_claim
    description: |-
      The medical claim table stores final adjudicated medical claim lines for healthcare services or supplies billed by a provider and adjudicated by a payer. A single claim may have multiple claim lines, so claim_id identifies the claim and claim_line_number identifies the specific line within that claim.

      This model pulls from claims preprocessing, enriches claim lines with encounter grouping, service categories, terminology descriptions, and enrollment matching, and passes through claim extension columns and file metadata. Header-level fields, such as claim_type, person_id, payer, plan, claim_start_date, claim_end_date, admission_date, and discharge_date, should be consistent across all lines for the same claim_id. Line-level fields, such as claim_line_start_date, claim_line_end_date, revenue_center_code, hcpcs_code, service_unit_quantity, and payment amounts, may vary across claim lines.

      Contract-valid claims with claim_type = undetermined are retained. They receive other/other/other service categories and an orphaned claim encounter until their billing form classification can be resolved.

      Table grain: One record per medical claim line per data source.

      Primary key: medical_claim_id.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_core
        {% else %}core{%- endif -%}
      alias: medical_claim
      tags:
        - core
        - encounters
      materialized: table
    columns:
      - name: medical_claim_id
        description: Synthetic primary key for each medical claim line, created from
          claim_id, claim_line_number, and data_source.
        tests:
          - unique
          - not_null
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: claim_id
        description: Identifier for a medical claim. A claim may contain multiple claim
          lines, so the same claim_id may appear on multiple rows.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
      - name: claim_line_number
        description: Line number for the claim line represented by the row. Values
          should be positive integers and should uniquely identify each line
          within a claim_id.
        tests:
          - not_null
        data_type: integer
        config:
          meta:
            data_type: integer
      - name: encounter_id
        description: Identifier for the encounter associated with the claim line,
          created by claims preprocessing when the claim line is grouped into an
          encounter.
        config:
          meta:
            data_type: varchar
      - name: encounter_type
        description: Type of encounter assigned by claims preprocessing, such as acute
          inpatient, emergency department, outpatient, office visit, or skilled
          nursing facility.
        config:
          meta:
            data_type: varchar
      - name: encounter_group
        description: Higher-level grouping of encounter_type used for utilization and
          reporting.
        config:
          meta:
            data_type: varchar
      - name: claim_type
        description: Header-level classification of the medical claim as professional,
          institutional, or undetermined. Professional claims generally have
          place_of_service_code; institutional claims generally have
          bill_type_code and revenue_center_code.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/claim-type
            data_type: varchar
      - name: person_id
        description: Globally unique identifier for the person who received care.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
      - name: member_id
        description: Identifier assigned by the payer or health plan for the person's
          coverage. This should identify the member associated with the claim.
        config:
          meta:
            data_type: varchar
      - name: payer
        description: Name of the payer responsible for the claim, for example Aetna,
          Blue Cross Blue Shield, or Medicare FFS.
        config:
          meta:
            data_type: varchar
      - name: plan
        description: Name of the health insurance plan or product associated with the claim.
        config:
          meta:
            data_type: varchar
      - name: claim_start_date
        description: Header-level start date for the claim. This value should be
          consistent across all lines for the same claim_id.
        config:
          meta:
            data_type: date
      - name: claim_end_date
        description: Header-level end date for the claim. This value should be
          consistent across all lines for the same claim_id and should be
          greater than or equal to claim_start_date.
        config:
          meta:
            data_type: date
      - name: claim_line_start_date
        description: Start date for the service or item represented by the claim line.
          This may differ across lines within the same claim.
        config:
          meta:
            data_type: date
      - name: claim_line_end_date
        description: End date for the service or item represented by the claim line.
          This may differ across lines within the same claim and should be
          greater than or equal to claim_line_start_date.
        config:
          meta:
            data_type: date
      - name: admission_date
        description: Header-level admission date for an inpatient institutional claim.
          Populated when the claim represents an inpatient facility stay.
        config:
          meta:
            data_type: date
      - name: discharge_date
        description: Header-level discharge date for an inpatient institutional claim.
          Populated when the claim represents an inpatient facility stay.
        config:
          meta:
            data_type: date
      - name: service_category_1
        description: The broader service category this claim belongs to.
        config:
          meta:
            terminology: https://thetuvaproject.com/value-sets/service-categories
            data_type: varchar
      - name: service_category_2
        description: The more specific service category this claim belongs to.
        config:
          meta:
            terminology: https://thetuvaproject.com/value-sets/service-categories
            data_type: varchar
      - name: service_category_3
        description: The most specific service category this claim belongs to.
        config:
          meta:
            data_type: varchar
      - name: admit_source_code
        description: Indicates where the patient was before the healthcare encounter
          (inpatient claims only).
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/admit-source
            data_type: varchar
      - name: admit_source_description
        description: Description of the admit_source_code for the encounter.
        config:
          meta:
            data_type: varchar
      - name: admit_type_code
        description: Indicates the type of admission (inpatient claims only).
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/admit-type
            data_type: varchar
      - name: admit_type_description
        description: Description of the admit_type_code for the encounter.
        config:
          meta:
            data_type: varchar
      - name: discharge_disposition_code
        description: Indicates the type of setting the patient was discharged to
          (institutional inpatient claims only).
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/discharge-disposition
            data_type: varchar
      - name: discharge_disposition_description
        description: Description of the discharge_disposition_code for the encounter.
        config:
          meta:
            data_type: varchar
      - name: place_of_service_code
        description: Line-level code indicating where a professional service was
          provided. Professional claim lines should generally have a
          place_of_service_code; institutional claims should generally not.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/place-of-service
            data_type: varchar
      - name: place_of_service_description
        description: Description of place_of_service_code, derived from Tuva place of
          service terminology.
        config:
          meta:
            data_type: varchar
      - name: bill_type_code
        description: Header-level bill type code for institutional claims. This
          identifies the type of facility claim and should be consistent across
          all lines for the same claim_id.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/bill-type
            data_type: varchar
      - name: bill_type_description
        description: Description of bill_type_code, derived from Tuva bill type terminology.
        config:
          meta:
            data_type: varchar
      - name: drg_code_type
        description: Diagnosis-related group code system for drg_code, when a DRG is
          assigned to the claim. Examples include ms-drg and apr-drg.
        config:
          meta:
            data_type: varchar
      - name: drg_code
        description: Diagnosis-related group code assigned to the claim, when available.
          This is most relevant for inpatient institutional claims.
        config:
          meta:
            data_type: varchar
      - name: drg_description
        description: Description of drg_code, derived from Tuva MS-DRG or APR-DRG
          terminology.
        config:
          meta:
            data_type: varchar
      - name: revenue_center_code
        description: Line-level revenue center code for institutional claims. This
          identifies the department or service area associated with the claim
          line and should preserve leading zeroes when present.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/revenue-center
            data_type: varchar
      - name: revenue_center_description
        description: Description of revenue_center_code, derived from Tuva revenue
          center terminology.
        config:
          meta:
            data_type: varchar
      - name: service_unit_quantity
        description: Number of service units associated with the claim line. For
          institutional claims this often corresponds to the revenue center
          line.
        config:
          meta:
            data_type: number
      - name: hcpcs_code
        description: CPT or HCPCS code for the procedure, service, or supply on the
          claim line.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/hcpcs-level-2
            data_type: varchar
      - name: hcpcs_modifier_1
        description: 1st modifier for HCPCS code.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/hcpcs-level-2
            data_type: varchar
      - name: hcpcs_modifier_2
        description: 2nd modifier for HCPCS code.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/hcpcs-level-2
            data_type: varchar
      - name: hcpcs_modifier_3
        description: 3rd modifier for HCPCS code.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/hcpcs-level-2
            data_type: varchar
      - name: hcpcs_modifier_4
        description: 4th modifier for HCPCS code.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/hcpcs-level-2
            data_type: varchar
      - name: hcpcs_modifier_5
        description: 5th modifier for HCPCS code.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/hcpcs-level-2
            data_type: varchar
      - name: rendering_npi
        description: NPI for the practitioner or provider who rendered the service on
          the claim line. This is generally line-level and may vary across
          lines.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/provider
            terminology_note: '**Note: this terminology set is too large to be loaded as a
              seed and is instead loaded from public cloud storage for supported
              adapters.'
            data_type: varchar
      - name: rendering_tin
        description: Rendering provider tax identification number (TIN).
        config:
          meta:
            data_type: varchar
      - name: rendering_name
        description: Rendering provider name.
        config:
          meta:
            data_type: varchar
      - name: billing_npi
        description: NPI for the billing provider or organization responsible for
          submitting the claim. This is generally header-level and should be
          consistent across lines for the same claim_id.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/provider
            terminology_note: '**Note: this terminology set is too large to be loaded as a
              seed and is instead loaded from public cloud storage for supported
              adapters.'
            data_type: varchar
      - name: billing_tin
        description: Billing provider tax identification number (TIN).
        config:
          meta:
            data_type: varchar
      - name: billing_name
        description: Billing provider name.
        config:
          meta:
            data_type: varchar
      - name: facility_npi
        description: NPI for the facility where services were delivered. This is
          especially important for institutional claims and encounter grouping.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/provider
            terminology_note: '**Note: this terminology set is too large to be loaded as a
              seed and is instead loaded from public cloud storage for supported
              adapters.'
            data_type: varchar
      - name: facility_name
        description: Name of the facility where services were delivered, when available.
        config:
          meta:
            data_type: varchar
      - name: paid_date
        description: Date the claim was paid by the payer. This often occurs after
          claim_end_date.
        config:
          meta:
            data_type: date
      - name: paid_amount
        description: Amount paid by the payer for the claim line after adjustment,
          denial, reversal, and replacement logic has been applied.
        config:
          meta:
            data_type: number
      - name: allowed_amount
        description: Total allowed amount for the claim line, including payer-paid and
          patient-responsibility amounts.
        config:
          meta:
            data_type: number
      - name: charge_amount
        description: Amount charged or billed by the provider for the claim line before
          payer adjudication.
        config:
          meta:
            data_type: number
      - name: coinsurance_amount
        description: Coinsurance amount owed by the member for the claim line. This
          represents percentage-based member cost sharing.
        config:
          meta:
            data_type: number
      - name: copayment_amount
        description: Copayment amount owed by the member for the claim line. This
          represents fixed-dollar member cost sharing.
        config:
          meta:
            data_type: number
      - name: deductible_amount
        description: Deductible amount owed by the member for the claim line before
          payer coverage applies.
        config:
          meta:
            data_type: number
      - name: total_cost_amount
        description: Total cost amount for the claim line. This may equal
          allowed_amount, but can differ when the source includes additional
          cost components not captured by the standard payer-paid and
          patient-responsibility fields.
        config:
          meta:
            data_type: number
      - name: paid_reduced_by
        description: Amount by which the payer reduced its payment on the claim
          line under a prospective or population-based payment arrangement, such
          as the Medicare Population-Based Payment (PBP) reduction. paid_amount
          reflects the payment after this reduction. Null when the source does
          not report a reduction.
        config:
          meta:
            data_type: number
      - name: in_network_flag
        description: Indicator for whether the claim was in network. Accepted values are
          1 for in network, 0 for out of network, and null when unknown.
        config:
          meta:
            data_type: integer
      - name: enrollment_flag
        description: Indicator for whether the claim line has corresponding eligibility
          during the same period when the service occurred.
        config:
          meta:
            data_type: integer
      - name: member_month_id
        description: Synthetic key for the member month associated with the claim line
          when matching eligibility is available.
        config:
          meta:
            data_type: varchar
      - name: file_date
        description: Date associated with the source file. This may represent the
          delivery date, reporting period, or date embedded in the file name.
          Format as YYYY-MM-DD when serialized.
        config:
          meta:
            data_type: date
      - name: ingest_datetime
        description: Date and time the source claim line or file was loaded into the
          data warehouse. This is useful when multiple versions of the same
          claim line are received over time.
        config:
          meta:
            data_type: timestamp
      - name: file_name
        description: Name of the source file from which the claim line originated. This
          field is useful for tracing source records across file-based claims
          extracts.
        config:
          meta:
            data_type: varchar
      - name: tuva_last_run
        description: Timestamp when this dbt invocation started. Defaults to
          `run_started_at` in UTC and can be overridden with the `tuva_last_run`
          variable.
        config:
          meta:
            data_type: timestamp
      - name: data_source
        description: User-defined name that identifies the source of the medical claim
          data, for example BCBS Tennessee, Medicare FFS, or Medicaid Ohio.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
  - name: core__medication
    description: |-
      The medication table contains medication records from clinical source systems and pharmacy claims. Clinical rows represent medication orders, administrations, and dispense records documented in an EHR or other clinical system. Claims rows represent adjudicated pharmacy claim lines from core.pharmacy_claim.

      When clinical data is enabled, this model pulls from input_layer.medication through normalized__medication. When claims data is enabled, this model pulls from core.pharmacy_claim through core__stg_claims_medication. Tuva derives NDC, RxNorm, and ATC codes and descriptions from the package's CodeRx Open data assets when standard medication codes are available. When `use_coderx_enterprise` is true, Tuva's shared CodeRx interfaces instead use user-managed `packages`, `drugs`, and `classes` relations in the target database's `coderx` schema throughout pharmacy normalization, medication enrichment, data quality, and dependent packages. If CodeRx supplies multiple class rows for a drug, Tuva selects the lexicographically first non-null level 3 ATC code to preserve the medication grain. Claims-derived rows use pharmacy_claim_id as medication_id, set source_type to claims, populate claim_id and claim_line_number from core.pharmacy_claim, and populate practitioner_id from the prescribing provider NPI.

      Clinical and claims records retain their source identifiers in medication_id. Because those two domains can independently reuse the same value in one data source, source_type is part of the public key.

      Primary key: medication_id, source_type, data_source.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - medication_id
              - source_type
              - data_source
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_core
        {% else %}core{%- endif -%}
      alias: medication
      tags: core
      materialized: table
    columns:
      - name: medication_id
        description: Identifier for a medication record within a data source. Clinical rows
          are populated from input_layer.medication.medication_id. Claims rows
          are populated from core.pharmacy_claim.pharmacy_claim_id. The same
          value may exist in both source domains, so use source_type and
          data_source with this field as the complete record key.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: source_type
        description: Indicates whether the medication row came from claims or clinical
          data. Accepted values are claims and clinical. This field is part of
          the public primary key with medication_id and data_source.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - claims
                  - clinical
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: person_id
        description: Globally unique identifier for the person associated with the
          medication record. Clinical rows are populated from
          input_layer.medication.person_id. Claims rows are populated from
          core.pharmacy_claim.person_id.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
      - name: member_id
        description: Identifier assigned by the payer or health plan for the person's
          coverage. This is populated from core.pharmacy_claim.member_id for
          claims rows and is null for clinical rows.
        config:
          meta:
            data_type: varchar
      - name: patient_id
        description: Identifier that links the person to a particular clinical source
          system, for example a medical record number or MRN. This is populated
          from input_layer.medication.patient_id for clinical rows and is null
          for claims rows.
        config:
          meta:
            data_type: varchar
      - name: encounter_id
        description: Identifier for the encounter associated with the medication record,
          when available. This is populated from
          input_layer.medication.encounter_id for clinical rows and is null for
          claims rows.
        config:
          meta:
            data_type: varchar
      - name: claim_id
        description: Identifier for the pharmacy claim associated with the medication
          row. This is populated from core.pharmacy_claim.claim_id for claims rows
          and is null for clinical rows.
        config:
          meta:
            data_type: varchar
      - name: claim_line_number
        description: Line number for the pharmacy claim line associated with the
          medication row. This is populated from
          core.pharmacy_claim.claim_line_number for claims rows and is null for
          clinical rows.
        config:
          meta:
            data_type: integer
      - name: payer
        description: Name of the payer responsible for the pharmacy claim. This is
          populated from core.pharmacy_claim.payer for claims rows and is null
          for clinical rows.
        config:
          meta:
            data_type: varchar
      - name: plan
        description: Name of the health insurance plan or product associated with the
          pharmacy claim. This is populated from core.pharmacy_claim.plan for
          claims rows and is null for clinical rows.
        config:
          meta:
            data_type: varchar
      - name: dispensing_date
        description: Date the medication was dispensed or administered, when available.
          Clinical rows are populated from input_layer.medication.dispensing_date.
          Claims rows are populated from core.pharmacy_claim.dispensing_date.
        config:
          meta:
            data_type: date
      - name: prescribing_date
        description: Date the medication was prescribed or ordered, when available.
          Clinical rows are populated from input_layer.medication.prescribing_date.
          Claims rows are null because core.pharmacy_claim does not currently
          contain a prescribing date.
        config:
          meta:
            data_type: date
      - name: source_code_type
        description: Code system for source_code. Clinical rows are populated from
          input_layer.medication.source_code_type. Claims rows are set to ndc
          because the source code comes from core.pharmacy_claim.ndc_code.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/code-type
            data_type: varchar
      - name: source_code
        description: Medication code from the source system before Tuva normalization.
          Clinical rows are populated from input_layer.medication.source_code.
          Claims rows are populated from core.pharmacy_claim.ndc_code.
        config:
          meta:
            terminology: https://www.nlm.nih.gov/research/umls/rxnorm/index.html
            data_type: varchar
      - name: source_description
        description: Medication name or description from the source system. Clinical
          rows are populated from input_layer.medication.source_description.
          Because pharmacy claims do not carry a raw medication description,
          claims rows are populated from the CodeRx package selected by
          use_coderx_enterprise when that NDC matches.
        config:
          meta:
            data_type: varchar
      - name: ndc_code
        description: National Drug Code for the medication. Clinical rows may be
          populated from input_layer.medication.ndc_code or derived from
          CodeRx packages. Claims rows are populated from core.pharmacy_claim.ndc_code.
        config:
          meta:
            terminology: https://www.fda.gov/drugs/drug-approvals-and-databases/national-drug-code-directory
            data_type: varchar
      - name: ndc_description
        description: Medication description associated with ndc_code. This is derived
          from the matched CodeRx package when available. The original clinical
          description remains available in source_description; claims
          source_description also uses the selected CodeRx package because claims
          do not supply a raw medication description.
        config:
          meta:
            data_type: varchar
      - name: rxnorm_code
        description: RxNorm RxCUI for the medication. Clinical rows may be populated
          from input_layer.medication.rxnorm_code or derived from CodeRx drugs.
          Claims rows are derived through the matched CodeRx package when available.
        config:
          meta:
            terminology: https://www.nlm.nih.gov/research/umls/rxnorm/index.html
            data_type: varchar
      - name: rxnorm_description
        description: Medication description associated with rxnorm_code, derived from
          the matched CodeRx drug when available.
        config:
          meta:
            data_type: varchar
      - name: atc_code
        description: WHO Anatomical Therapeutic Chemical classification code for the
          medication. Clinical rows may be populated from
          input_layer.medication.atc_code or derived from the level 3 CodeRx class.
          Claims rows are derived through the matched NDC and RxNorm concepts when available.
        config:
          meta:
            terminology: https://www.who.int/tools/atc-ddd-toolkit/atc-classification
            data_type: varchar
      - name: atc_description
        description: Medication classification description associated with atc_code,
          derived from the matching CodeRx class hierarchy level when an ATC code
          is supplied, or from the selected level 3 class when Tuva derives the code.
        config:
          meta:
            data_type: varchar
      - name: route
        description: Route by which the medication was administered or intended to be
          administered. This is populated from input_layer.medication.route for
          clinical rows and is null for claims rows.
        config:
          meta:
            data_type: varchar
      - name: strength
        description: Medication strength as represented by the source system. This is
          populated from input_layer.medication.strength for clinical rows and is
          null for claims rows.
        config:
          meta:
            data_type: varchar
      - name: quantity
        description: Numeric quantity of medication associated with the record.
          Clinical rows are populated from input_layer.medication.quantity.
          Claims rows are populated from core.pharmacy_claim.quantity.
        config:
          meta:
            data_type: integer
      - name: quantity_unit
        description: Unit of measure for quantity. This is populated from
          input_layer.medication.quantity_unit for clinical rows and is null for
          claims rows.
        config:
          meta:
            data_type: varchar
      - name: days_supply
        description: Number of days the medication supply is expected to last. Clinical
          rows are populated from input_layer.medication.days_supply. Claims rows
          are populated from core.pharmacy_claim.days_supply.
        config:
          meta:
            data_type: integer
      - name: practitioner_id
        description: Identifier for the practitioner associated with the medication
          record. Clinical rows are populated from
          input_layer.medication.practitioner_id and may represent the ordering,
          prescribing, or administering practitioner. Claims rows are populated
          from core.pharmacy_claim.prescribing_provider_id, which is generally the
          prescribing provider NPI.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/provider
            terminology_note: '**Note: this terminology set is too large to be loaded as a
              seed and is instead loaded from public cloud storage for supported
              adapters.'
            data_type: varchar
      - name: ingest_datetime
        description: Date and time the originating clinical medication or pharmacy claim line was loaded into the data warehouse.
        config:
          meta:
            data_type: timestamp
      - name: tuva_last_run
        description: Timestamp when this dbt invocation started. Defaults to
          `run_started_at` in UTC and can be overridden with the `tuva_last_run`
          variable.
      - name: data_source
        description: User-defined name that identifies the source of the medication data.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
            is_primary_key: true
  - name: core__member_month
    description: |-
      The member_month table stores one record per person, member, year month, payer, plan, and data source from eligibility spans. Members without claims are included because this table is derived from eligibility, not claim activity. Member months use Tuva's package-owned January 1900 through December 2100 month spine and stop at the calendar month containing the date portion of tuva_last_run for both open and finite spans, so Tuva does not publish future member months.

      This model is the final Core projection of the Claims Preprocessing member-month output plus Claims Preprocessing attribution. Member-month construction happens in member_month__member_month, and payer-attributed, custom-attributed, and Tuva-attributed provider fields are supplied by provider_attribution__member_month_attribution. Tuva-assigned attribution is calculated at person, data source, and performance year grain and copied to each member month in the matching year.

      Primary key: member_month_id.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_core
        {% else %}core{%- endif -%}
      alias: member_month
      tags: core
      materialized: table
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - member_month_id
    columns:
      - name: member_month_id
        description: Synthetic key created from person_id, member_id, year_month, payer,
          plan, and data_source.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: person_id
        description: Globally unique identifier for the person covered during the member
          month.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
      - name: member_id
        description: Identifier assigned by the payer or health plan for the person's
          coverage during the member month.
        config:
          meta:
            data_type: varchar
      - name: year_month
        description: Calendar month of eligibility represented by the member month,
          formatted as YYYYMM.
        config:
          meta:
            data_type: varchar
      - name: payer
        description: Name of the payer providing coverage during the member month.
        config:
          meta:
            data_type: varchar
      - name: plan
        description: Name of the health insurance plan or product associated with the
          member month.
        config:
          meta:
            data_type: varchar
      - name: tuva_last_run
        description: Timestamp when this dbt invocation started. Defaults to
          `run_started_at` in UTC and can be overridden with the `tuva_last_run`
          variable.
        config:
          meta:
            data_type: varchar
      - name: payer_attributed_provider
        description: Provider assigned to the member by the payer, health plan,
          contract, or other external attribution source.
      - name: payer_attributed_provider_practice
        description: Practice assigned to the member by the payer or external
          attribution source.
      - name: payer_attributed_provider_organization
        description: Organization assigned to the member by the payer or external
          attribution source.
      - name: payer_attributed_provider_lob
        description: Line of business assigned to the member by the payer or external
          attribution source.
      - name: custom_attributed_provider
        description: Provider assigned to the member by a user-defined or custom
          attribution methodology.
      - name: custom_attributed_provider_practice
        description: Practice assigned to the member by a user-defined or custom
          attribution methodology.
      - name: custom_attributed_provider_organization
        description: Organization assigned to the member by a user-defined or custom
          attribution methodology.
      - name: custom_attributed_provider_lob
        description: Line of business assigned to the member by a user-defined or custom
          attribution methodology.
      - name: tuva_attributed_provider
        description: Provider assigned to the member month by Tuva's claims-based attribution logic. This is copied from the yearly attribution assignment for the same person, data source, and calendar year, and is null when no assignable claims history exists.
        config:
          meta:
            data_type: varchar
      - name: tuva_attributed_provider_bucket
        description: Tuva attribution provider classification bucket, such as PCP, NPP, specialist, or no eligible history.
        config:
          meta:
            data_type: varchar
      - name: tuva_attributed_provider_specialty
        description: Specialty description for the Tuva-attributed provider when available.
        config:
          meta:
            data_type: varchar
      - name: data_source
        description: User-defined name that identifies the source of the eligibility
          data used to create the member month.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
  - name: core__observation
    description: |-
      The observation table contains normalized clinical observation records from source systems, including vital signs, social history observations, survey results, exam findings, imaging observations, therapy observations, activity observations, and other non-laboratory clinical observations.

      This model pulls from normalized__observation after the Normalized Layer casts fields to the core observation data types, normalizes observation_type using Tuva reference data, and derives normalized_code_type, normalized_code, and normalized_description from terminology joins. Normalized units and normalized reference ranges are passed through from the input layer when they are populated upstream.

      Primary key: observation_id, data_source.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - observation_id
              - data_source
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_core
        {% else %}core{%- endif -%}
      alias: observation
      tags: core
      materialized: table
    columns:
      - name: observation_id
        description: Identifier for an observation record within a data source. This
          value identifies the observation when combined with data_source.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: person_id
        description: Globally unique identifier for the person associated with the
          observation.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
      - name: patient_id
        description: Identifier that links the person to a particular clinical source
          system, for example a medical record number or MRN.
        config:
          meta:
            data_type: varchar
      - name: encounter_id
        description: Identifier for the encounter associated with the observation, when
          available.
        config:
          meta:
            data_type: varchar
      - name: panel_id
        description: Identifier for a group or panel of related observations, when
          available.
        config:
          meta:
            data_type: varchar
      - name: observation_date
        description: Date the observation was recorded, observed, or resulted.
        config:
          meta:
            data_type: date
      - name: observation_type
        description: High-level category of observation after Tuva terminology
          normalization.
        config:
          meta:
            data_type: varchar
      - name: source_code_type
        description: Code system for source_code as represented in the source system.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/code-type
            data_type: varchar
      - name: source_code
        description: Observation code from the source system before Tuva normalization.
        config:
          meta:
            data_type: varchar
      - name: source_description
        description: Observation name or description from the source system.
        config:
          meta:
            data_type: varchar
      - name: normalized_code_type
        description: Normalized observation code system derived from Tuva terminology.
        config:
          meta:
            data_type: varchar
      - name: normalized_code
        description: Normalized observation code derived from Tuva terminology.
        config:
          meta:
            data_type: varchar
      - name: normalized_description
        description: Human-readable description for normalized_code, derived from Tuva
          terminology.
        config:
          meta:
            data_type: varchar
      - name: result
        description: Observation result value as represented in the source system.
        config:
          meta:
            data_type: varchar
      - name: source_units
        description: Unit of measure for result as represented in the source system.
        config:
          meta:
            data_type: varchar
      - name: normalized_units
        description: Standardized unit of measure for result, when available.
        config:
          meta:
            data_type: varchar
      - name: source_reference_range_low
        description: Lower bound of the reference range from the source system, when
          available.
        config:
          meta:
            data_type: varchar
      - name: source_reference_range_high
        description: Upper bound of the reference range from the source system, when
          available.
        config:
          meta:
            data_type: varchar
      - name: normalized_reference_range_low
        description: Standardized lower bound of the reference range, when available.
          This should use the same unit convention as normalized_units.
        config:
          meta:
            data_type: varchar
      - name: normalized_reference_range_high
        description: Standardized upper bound of the reference range, when available.
          This should use the same unit convention as normalized_units.
        config:
          meta:
            data_type: varchar
      - name: ingest_datetime
        description: Date and time the source observation record was loaded into the data warehouse.
        config:
          meta:
            data_type: timestamp
      - name: tuva_last_run
        description: Timestamp when this dbt invocation started. Defaults to
          `run_started_at` in UTC and can be overridden with the `tuva_last_run`
          variable.
        config:
          meta:
            data_type: timestamp
      - name: data_source
        description: User-defined name that identifies the source of the observation data.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
            is_primary_key: true

  - name: core__int_patient_remove_duplicates
    description: |-
      This model removes duplicate clinical patient records for each person_id and data_source. When multiple upstream records exist, it keeps the record with the latest non-null ingest_datetime, then uses patient_id descending as a tie-breaker.

      Primary key: person_id, data_source.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_core
        {% else %}core{%- endif -%}
      alias: int_patient_remove_duplicates
      meta:
        dag:
          node_type: intermediate
      tags:
        - core
        - core_stage_clinical
      materialized: table
    columns:
      - name: person_id
        description: Globally unique identifier for the person across the dataset. This
          should remain stable even when the person has multiple patient IDs or
          medical record numbers.
        config:
          meta:
            is_primary_key: true
      - name: patient_id
        description: Identifier for the person in a specific clinical source system,
          such as MRN. A single person can have multiple patient IDs.
      - name: first_name
        description: Patient first name as represented in the source system.
      - name: middle_name
        description: Patient middle name as represented in the source system.
      - name: last_name
        description: Patient last name as represented in the source system.
      - name: name_suffix
        description: Patient name suffix, such as Jr., Sr., or III.
      - name: sex
        description: Biological sex of the patient. Accepted values are male, female, or
          unknown, all lowercase.
      - name: race
        description: Patient race. This value should match a Tuva race terminology
          description.
      - name: ethnicity
        description: Patient ethnicity. This value should match a Tuva ethnicity
          terminology code.
      - name: birth_date
        description: Patient date of birth in YYYY-MM-DD format.
      - name: death_date
        description: Patient date of death in YYYY-MM-DD format. Leave null if the
          patient is not deceased or if no death date is available.
      - name: death_flag
        description: Indicator that the patient is deceased. Use 1 for deceased and 0
          for not known deceased.
      - name: social_security_number
        description: Patient Social Security number as a string in XXX-XX-XXXX format,
          including dashes, when available and permitted.
      - name: address
        description: Street address where the patient lives.
      - name: city
        description: City where the patient lives.
      - name: state
        description: State where the patient lives.
      - name: zip_code
        description: ZIP code where the patient lives.
      - name: county
        description: County where the patient lives.
      - name: latitude
        description: Decimal-degree latitude for the patient's address, when available.
      - name: longitude
        description: Decimal-degree longitude for the patient's address, when available.
      - name: phone
        description: Patient phone number as represented in the source system.
      - name: email
        description: Patient email address as represented in the source system.
      - name: ingest_datetime
        description: Date and time the patient record was extracted from the source
          system or ingested into the data warehouse.
      - name: tuva_last_run
        description: Timestamp when this dbt invocation started. Defaults to
          `run_started_at` in UTC and can be overridden with the `tuva_last_run`
          variable.
      - name: data_source
        description: User-defined name that identifies the clinical source, for example
          Epic, Athena Health, or Cerner. This value should be populated on
          every record.
        config:
          meta:
            is_primary_key: true
  - name: core__patient
    description: >-
      This model builds the core patient table from the input layer patient and
      eligibility tables. When the clinical input layer is enabled, it pulls
      patient records from the deduplicated patient table derived from
      input_layer.patient. When claims is enabled, it pulls eligibility-derived
      patient records from the deduplicated eligibility table derived from
      input_layer.eligibility. When both clinical and claims are enabled, it
      unions the two sources together and applies an additional deduplication
      step that gives eligibility-derived records precedence over clinical
      patient records. The model also calculates age and age_group from
      birth_date and tuva_last_run. Extension columns from input_layer.patient
      are populated only on clinical-derived rows; eligibility-derived rows do
      not receive extension values. The table is intended to have one record per
      unique person within each data source. Primary key: person_id,
      data_source.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_core
        {% else %}core{%- endif -%}
      alias: patient
      meta:
        dag:
          node_type: output
      tags: core
      materialized: table
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - data_source
    columns:
      - name: person_id
        description: Globally unique identifier for the person across the dataset. This
          should remain stable even when the person has multiple patient IDs,
          member IDs, or medical record numbers.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: sex
        description: Biological sex of the patient. Expected values are male, female, or
          unknown.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/sex
            data_type: varchar
      - name: race
        description: Patient race, mapped to Tuva race terminology when available.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/race
            data_type: varchar
      - name: birth_date
        description: Patient date of birth.
        config:
          meta:
            data_type: date
      - name: death_date
        description: Patient date of death, when available.
        config:
          meta:
            data_type: date
      - name: death_flag
        description: Indicator that the patient is deceased. Expected values are 1 for
          deceased, 0 for not known deceased, or null when unknown.
        data_type: integer
        config:
          meta:
            data_type: integer
      - name: name_suffix
        description: Patient name suffix, such as Jr., Sr., or III.
        config:
          meta:
            data_type: varchar
      - name: first_name
        description: Patient first name.
        config:
          meta:
            data_type: varchar
      - name: middle_name
        description: Patient middle name.
        config:
          meta:
            data_type: varchar
      - name: last_name
        description: Patient last name.
        config:
          meta:
            data_type: varchar
      - name: social_security_number
        description: Patient Social Security number as a string in XXX-XX-XXXX format,
          including dashes, when available and permitted.
        config:
          meta:
            data_type: varchar
      - name: address
        description: Street address where the patient lives.
        config:
          meta:
            data_type: varchar
      - name: city
        description: City where the patient lives.
        config:
          meta:
            data_type: varchar
      - name: state
        description: State where the patient lives.
        config:
          meta:
            data_type: varchar
      - name: zip_code
        description: ZIP code where the patient lives.
        config:
          meta:
            data_type: varchar
      - name: county
        description: County where the patient lives.
        config:
          meta:
            data_type: varchar
      - name: latitude
        description: Decimal-degree latitude for the patient's address, when available.
        config:
          meta:
            data_type: float
      - name: longitude
        description: Decimal-degree longitude for the patient's address, when available.
        config:
          meta:
            data_type: float
      - name: phone
        description: Patient phone number as represented in the source system.
        config:
          meta:
            data_type: varchar
      - name: email
        description: Patient email address as represented in the source system.
        config:
          meta:
            data_type: varchar
      - name: ethnicity
        description: Patient ethnicity, mapped to Tuva ethnicity terminology when available.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/ethnicity
            data_type: varchar
      - name: age
        description: Patient age calculated from birth_date and tuva_last_run.
        config:
          meta:
            data_type: integer
      - name: age_group
        description: Decade age group derived from age.
        config:
          meta:
            data_type: varchar
      - name: ingest_datetime
        description: Date and time the selected clinical patient record was extracted from the source system or loaded into the data warehouse. This is null for patient rows derived from eligibility records.
        config:
          meta:
            data_type: timestamp
      - name: tuva_last_run
        description: Timestamp when this dbt invocation started. Defaults to
          `run_started_at` in UTC and can be overridden with the `tuva_last_run`
          variable.
        config:
          meta:
            data_type: timestamp
      - name: data_source
        description: User-defined name that identifies the source of the patient record,
          for example a claims payer data source or a clinical system such as
          Epic, Athena Health, or Cerner.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
            is_primary_key: true
  - name: core__person_id_crosswalk
    description: |-
      The person ID crosswalk table stores source identifiers associated with each person across claims and clinical data. Claims-derived rows use member_id, payer, plan, and data_source from eligibility. Clinical rows use patient_id and data_source from the clinical patient input layer.

      This table is useful for tracing the globally unique person_id back to source-system identifiers such as member IDs and medical record numbers.

      Primary key: person_id, patient_id, member_id, payer, plan, data_source.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_core
        {% else %}core{%- endif -%}
      alias: person_id_crosswalk
      tags: core
      materialized: table
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - patient_id
              - member_id
              - payer
              - '{{ quote_column("plan") }}'
              - data_source
    columns:
      - name: person_id
        description: Globally unique identifier for the person across the dataset.
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: patient_id
        description: Identifier that links the person to a particular clinical source
          system, for example a medical record number or MRN. Populated for
          clinical source rows.
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: member_id
        description: Identifier assigned by the payer or health plan for the person's
          coverage. Populated for claims eligibility source rows.
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: payer
        description: Name of the payer associated with the member_id, when the source
          row comes from eligibility.
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: plan
        description: Name of the health insurance plan or product associated with the
          member_id, when the source row comes from eligibility.
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: tuva_last_run
        description: Timestamp when this dbt invocation started. Defaults to
          `run_started_at` in UTC and can be overridden with the `tuva_last_run`
          variable.
        config:
          meta:
            data_type: timestamp
      - name: data_source
        description: User-defined name that identifies the source system or dataset for
          the source identifier.
        config:
          meta:
            data_type: varchar
            is_primary_key: true
  - name: core__pharmacy_claim
    description: |-
      The pharmacy claim table stores final adjudicated pharmacy claim lines for prescription medications dispensed by a pharmacy, submitted for payment, and adjudicated by a payer. Prescriptions that were ordered but not filled should not appear in this table.

      This model pulls from claims preprocessing, enriches pharmacy claim lines with NDC descriptions and enrollment matching, and passes through pharmacy claim extension columns and file metadata. Most pharmacy claims have one line, but claim_line_number is included to support sources that represent a single pharmacy claim with multiple lines and to keep the grain consistent with medical_claim.

      Table grain: One record per pharmacy claim line per data source.

      Primary key: pharmacy_claim_id.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_core
        {% else %}core{%- endif -%}
      alias: pharmacy_claim
      tags: core
      materialized: table
    columns:
      - name: pharmacy_claim_id
        description: Synthetic primary key for each pharmacy claim line, created from
          claim_id, claim_line_number, and data_source.
        tests:
          - unique
          - not_null
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: claim_id
        description: Identifier for a pharmacy claim. Most pharmacy claims have one
          claim line, but the same claim_id may appear on multiple rows when a
          source represents a single claim with multiple lines.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
      - name: claim_line_number
        description: Line number for the pharmacy claim line represented by the row.
          Values should be positive integers and should uniquely identify each
          line within a claim_id.
        tests:
          - not_null
        data_type: integer
        config:
          meta:
            data_type: integer
      - name: person_id
        description: Globally unique identifier for the person who received the
          dispensed medication.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
      - name: member_id
        description: Identifier assigned by the payer or health plan for the person's
          coverage. This should identify the member associated with the pharmacy
          claim.
        config:
          meta:
            data_type: varchar
      - name: payer
        description: Name of the payer responsible for the pharmacy claim, for example
          Aetna, Blue Cross Blue Shield, or Medicare Part D.
        config:
          meta:
            data_type: varchar
      - name: plan
        description: Name of the health insurance plan or product associated with the
          pharmacy claim.
        config:
          meta:
            data_type: varchar
      - name: prescribing_provider_id
        description: Identifier for the provider who prescribed the medication. For
          claims-derived pharmacy records, this is generally the prescribing
          provider NPI.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/provider
            terminology_note: '**Note: this terminology set is too large to be loaded as a
              seed and is instead loaded from public cloud storage for supported
              adapters.'
            data_type: varchar
      - name: prescribing_provider_name
        description: Name of the provider who prescribed the medication, derived from
          provider terminology when available.
        config:
          meta:
            data_type: varchar
      - name: dispensing_provider_id
        description: Identifier for the provider or pharmacy that dispensed the
          medication. This often identifies the dispensing pharmacy organization
          rather than an individual pharmacist.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/provider
            terminology_note: '**Note: this terminology set is too large to be loaded as a
              seed and is instead loaded from public cloud storage for supported
              adapters.'
            data_type: varchar
      - name: dispensing_provider_name
        description: Name of the provider or pharmacy that dispensed the medication,
          derived from provider terminology when available.
        config:
          meta:
            data_type: varchar
      - name: dispensing_date
        description: Date the medication was dispensed to the patient. This may be
          called fill date in source data.
        config:
          meta:
            data_type: date
      - name: ndc_code
        description: National Drug Code for the medication dispensed on the pharmacy
          claim line.
        config:
          meta:
            terminology: https://www.fda.gov/drugs/drug-approvals-and-databases/national-drug-code-directory
            data_type: varchar
      - name: ndc_description
        description: Description of ndc_code, derived from the selected CodeRx
          packages terminology when available.
        config:
          meta:
            data_type: varchar
      - name: quantity
        description: Quantity of the medication dispensed on the pharmacy claim line.
        data_type: integer
        config:
          meta:
            data_type: integer
      - name: days_supply
        description: Number of days the dispensed medication is expected to last.
        data_type: integer
        config:
          meta:
            data_type: integer
      - name: refills
        description: Refill number or refill count associated with the dispensed
          prescription, as represented by the source.
        data_type: integer
        config:
          meta:
            data_type: integer
      - name: paid_date
        description: Date the pharmacy claim was paid or processed for payment by the payer.
        config:
          meta:
            data_type: date
      - name: paid_amount
        description: Amount paid by the payer for the pharmacy claim line after
          adjustment, denial, reversal, and replacement logic has been applied.
        config:
          meta:
            data_type: number
      - name: allowed_amount
        description: Total allowed amount for the pharmacy claim line, including
          payer-paid and patient-responsibility amounts when those fields are
          available.
        config:
          meta:
            data_type: number
      - name: charge_amount
        description: Amount charged or billed by the pharmacy for the medication before
          payer adjudication, discounts, or payment adjustments.
        config:
          meta:
            data_type: number
      - name: coinsurance_amount
        description: Coinsurance amount owed by the member for the pharmacy claim line.
        config:
          meta:
            data_type: number
      - name: copayment_amount
        description: Copayment amount owed by the member for the pharmacy claim line.
        config:
          meta:
            data_type: number
      - name: deductible_amount
        description: Deductible amount owed by the member for the pharmacy claim line
          before other coverage or cost sharing is applied.
        config:
          meta:
            data_type: number
      - name: in_network_flag
        description: Indicator for whether the pharmacy claim was in network. Accepted
          values are 1 for in network, 0 for out of network, and null when
          unknown.
        config:
          meta:
            data_type: integer
      - name: enrollment_flag
        description: Indicator for whether the pharmacy claim line has corresponding
          eligibility during the same period when the medication was dispensed.
        config:
          meta:
            data_type: integer
      - name: member_month_id
        description: Synthetic key for the member month associated with the pharmacy
          claim line when matching eligibility is available.
        config:
          meta:
            data_type: varchar
      - name: file_date
        description: Date associated with the source file. This may represent the
          delivery date, reporting period, or date embedded in the file name.
          Format as YYYY-MM-DD when serialized.
        config:
          meta:
            data_type: date
      - name: ingest_datetime
        description: Date and time the source pharmacy claim line or file was loaded
          into the data warehouse. This is useful when multiple versions of the
          same claim line are received over time.
        config:
          meta:
            data_type: timestamp
      - name: file_name
        description: Name of the source file from which the pharmacy claim line
          originated. This field is useful for tracing source records across
          file-based claims extracts.
        config:
          meta:
            data_type: varchar
      - name: tuva_last_run
        description: Timestamp when this dbt invocation started. Defaults to
          `run_started_at` in UTC and can be overridden with the `tuva_last_run`
          variable.
        config:
          meta:
            data_type: varchar
      - name: data_source
        description: User-defined name that identifies the source of the pharmacy claim
          data, for example BCBS Tennessee, Medicare Part D, or Medicaid Ohio.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
  - name: core__practitioner
    description: |-
      The practitioner table stores provider records from clinical and claims sources, including source-system practitioner identifiers, NPIs when available, provider names, practice affiliation, specialty, and sub-specialty.

      When clinical data is enabled, this table pulls practitioner records from input_layer.practitioner. When claims data is enabled, Tuva derives one practitioner record per provider identifier and claims data source from medical and pharmacy claims. Clinical practitioner records should use practitioner_id to preserve the source-system provider identifier; claims-derived records generally use provider identifiers from claims and provider terminology. When both paths produce the same practitioner_id and data_source, the clinical record takes precedence.

      Primary key: practitioner_id, data_source.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - practitioner_id
              - data_source
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_core
        {% else %}core{%- endif -%}
      alias: practitioner
      tags: core
      materialized: table
    columns:
      - name: practitioner_id
        description: Identifier for the practitioner within a data source. For clinical
          rows, this is the source-system practitioner identifier used by other
          clinical tables. For claims-derived rows, this is generally derived
          from the provider identifier on the claim.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: npi
        description: The practitioner's 10-digit National Provider Identifier, when
          available. For clinical practitioner rows, this should generally be an
          individual practitioner NPI rather than a facility or organization
          NPI.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/provider
            terminology_note: '**Note: this terminology set is too large to be loaded as a
              seed and is instead loaded from public cloud storage for supported
              adapters.'
            data_type: varchar
      - name: first_name
        description: First name of the practitioner as represented in the source system
          or provider terminology.
        config:
          meta:
            data_type: varchar
      - name: last_name
        description: Last name of the practitioner as represented in the source system
          or provider terminology.
        config:
          meta:
            data_type: varchar
      - name: practice_affiliation
        description: Practice, group, department, clinic, or organization with which the
          practitioner is affiliated, when available.
        config:
          meta:
            data_type: varchar
      - name: specialty
        description: Primary clinical specialty for the practitioner, such as family
          medicine, cardiology, or emergency medicine.
        config:
          meta:
            data_type: varchar
      - name: sub_specialty
        description: More specific specialty or subspecialty for the practitioner, when
          available.
        config:
          meta:
            data_type: varchar
      - name: ingest_datetime
        description: Date and time the originating clinical practitioner record was loaded into the data warehouse. This is null for claims-derived practitioners assembled from provider and claim data.
        config:
          meta:
            data_type: timestamp
      - name: tuva_last_run
        description: Timestamp when this dbt invocation started. Defaults to
          `run_started_at` in UTC and can be overridden with the `tuva_last_run`
          variable.
        config:
          meta:
            data_type: timestamp
      - name: data_source
        description: User-defined name that identifies the source of the practitioner
          data, for example a claims payer data source or a clinical system such
          as Epic, Athena Health, or Cerner.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
            is_primary_key: true
  - name: core__procedure
    description: |-
      The procedure table stores procedures performed for patients from claims and clinical sources.

      Claims-derived rows are created from the input layer medical_claim table. Tuva creates one procedure row for each non-null HCPCS code on a medical claim line and one procedure row for each non-null procedure_code_1 through procedure_code_25 value on the claim header. HCPCS rows retain HCPCS modifiers from the medical claim line and use the rendering NPI as practitioner_id. Clinical rows are created directly from input_layer.procedure when the clinical input layer is enabled.

      The Normalized Layer unpivots claims procedure fields and normalizes supported procedure code systems. The normalized clinical path and int_procedure_from_claims create collision-safe, domain-separated 32-character procedure IDs. Core procedure unions normalized clinical procedure rows with claims-derived procedure rows from int_procedure_from_claims, then joins normalized ICD-10-PCS codes to the Tuva Procedure Grouper to populate procedure_family and procedure. Clinical extension columns are pulled through when clinical data is enabled.

      Primary key: procedure_id.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - procedure_id
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_core
        {% else %}core{%- endif -%}
      alias: procedure
      tags: core
      materialized: table
    columns:
      - name: procedure_id
        description: >-
          Collision-safe, domain-separated 32-character lowercase Tuva
          identifier for the procedure. Clinical IDs hash data_source and
          source_procedure_id in the clinical-procedure domain. Claims-derived
          IDs hash source, claim, encounter, procedure sequence, code,
          procedure date, HCPCS modifiers, and rendering practitioner in the
          claims-procedure domain.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: person_id
        description: Globally unique identifier for the person associated with the procedure.
          For claims-derived rows, this is populated from input_layer.medical_claim.person_id.
          For clinical rows, this is populated from input_layer.procedure.person_id.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
      - name: member_id
        description: Payer or health plan member identifier associated with the procedure.
          This is populated from input_layer.medical_claim.member_id for claims-derived
          rows. Clinical procedure rows do not currently populate member_id.
        config:
          meta:
            data_type: varchar
      - name: patient_id
        description: Clinical source-system patient identifier associated with the procedure,
          such as a medical record number or MRN. This is populated from
          input_layer.procedure.patient_id for clinical rows. Claims-derived rows do
          not currently populate patient_id.
        config:
          meta:
            data_type: varchar
      - name: encounter_id
        description: Identifier for the encounter associated with the procedure. For
          claims-derived rows, this is populated from the claims encounter grouping
          output through core__medical_claim. For clinical rows, this is
          populated from input_layer.procedure.encounter_id when available.
        config:
          meta:
            data_type: varchar
      - name: claim_id
        description: Medical claim identifier associated with the procedure. This is
          populated from input_layer.medical_claim.claim_id for claims-derived rows
          and is null for clinical procedure rows.
        config:
          meta:
            data_type: varchar
      - name: procedure_date
        description: Date the procedure was performed or documented. For HCPCS rows
          created from medical claim lines, Tuva uses the first available date from
          claim_line_start_date, claim_start_date, admission_date, discharge_date, and
          claim_end_date. For claim header procedure-code rows, Tuva uses the
          corresponding procedure_date_1 through procedure_date_25 field. For clinical
          rows, this is populated from input_layer.procedure.procedure_date.
        config:
          meta:
            data_type: date
      - name: practitioner_id
        description: Clinician identifier associated with the procedure. For claims-derived
          rows, this is populated from input_layer.medical_claim.rendering_npi. For
          clinical rows, this is populated from input_layer.procedure.practitioner_id.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/provider
            terminology_note: '**Note: this terminology set is too large to be loaded as a
              seed and is instead loaded from public cloud storage for supported
              adapters.'
            data_type: varchar
      - name: code_system
        description: Code system for source_code. For claims-derived HCPCS rows, Tuva sets
          this to hcpcs from input_layer.medical_claim.hcpcs_code. For claims-derived
          header procedure rows, this is populated from
          input_layer.medical_claim.procedure_code_type. For clinical rows, this is
          populated from input_layer.procedure.code_system.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/code-type
            data_type: varchar
      - name: source_code
        description: Procedure code from the source data before Tuva normalization. For
          claims-derived HCPCS rows, this is populated from
          input_layer.medical_claim.hcpcs_code. For claims-derived header procedure
          rows, this is populated from procedure_code_1 through procedure_code_25. For
          clinical rows, this is populated from input_layer.procedure.source_code.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/icd-10-pcs
            terminology_note: '**Note: this terminology set is too large to be loaded as a
              seed and is instead loaded from public cloud storage for supported
              adapters.'
            data_type: varchar
      - name: source_description
        description: Source-system description of source_code. This is populated from
          input_layer.procedure.source_description for clinical rows. Claims-derived
          rows do not currently populate source_description because medical claims
          generally carry procedure codes without code descriptions.
        config:
          meta:
            data_type: varchar
      - name: normalized_code
        description: Normalized procedure code produced by matching code_system and
          source_code to Tuva terminology in the Normalized Layer. For supported source code systems this will
          usually match source_code, but it is only populated when the source code is
          present in the corresponding Tuva terminology asset.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/icd-10-pcs
            terminology_note: '**Note: this terminology set is too large to be loaded as a
              seed and is instead loaded from public cloud storage for supported
              adapters.'
            data_type: varchar
      - name: normalized_description
        description: Human-readable description for normalized_code, populated from the
          matched Tuva terminology table for ICD-10-PCS, ICD-9-PCS, HCPCS, or SNOMED CT.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/hcpcs-level-2
            data_type: varchar
      - name: procedure_family
        description: Higher-level procedure family assigned by the Tuva Procedure Grouper.
          Tuva populates this by joining normalized ICD-10-PCS procedure codes to
          tuva_procedure_grouper_code_map. This field remains null for HCPCS, ICD-9-PCS,
          SNOMED CT, and other code systems that are not currently mapped by the
          grouper.
        config:
          meta:
            data_type: varchar
      - name: procedure_name
        description: Mutually exclusive analytic procedure assigned by the Tuva Procedure
          Grouper. Tuva populates this by joining normalized ICD-10-PCS procedure codes
          to tuva_procedure_grouper_code_map. This field remains null for HCPCS,
          ICD-9-PCS, SNOMED CT, and other code systems that are not currently mapped by
          the grouper.
        config:
          meta:
            data_type: varchar
      - name: modifier_1
        description: First procedure modifier. For claims-derived HCPCS rows, this is
          populated from input_layer.medical_claim.hcpcs_modifier_1. For clinical rows,
          this is populated from input_layer.procedure.modifier_1. Claim header
          procedure-code rows do not currently populate modifiers.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/hcpcs-level-2
            data_type: varchar
      - name: modifier_2
        description: Second procedure modifier. For claims-derived HCPCS rows, this is
          populated from input_layer.medical_claim.hcpcs_modifier_2. For clinical rows,
          this is populated from input_layer.procedure.modifier_2. Claim header
          procedure-code rows do not currently populate modifiers.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/hcpcs-level-2
            data_type: varchar
      - name: modifier_3
        description: Third procedure modifier. For claims-derived HCPCS rows, this is
          populated from input_layer.medical_claim.hcpcs_modifier_3. For clinical rows,
          this is populated from input_layer.procedure.modifier_3. Claim header
          procedure-code rows do not currently populate modifiers.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/hcpcs-level-2
            data_type: varchar
      - name: modifier_4
        description: Fourth procedure modifier. For claims-derived HCPCS rows, this is
          populated from input_layer.medical_claim.hcpcs_modifier_4. For clinical rows,
          this is populated from input_layer.procedure.modifier_4. Claim header
          procedure-code rows do not currently populate modifiers.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/hcpcs-level-2
            data_type: varchar
      - name: modifier_5
        description: Fifth procedure modifier. For claims-derived HCPCS rows, this is
          populated from input_layer.medical_claim.hcpcs_modifier_5. For clinical rows,
          this is populated from input_layer.procedure.modifier_5. Claim header
          procedure-code rows do not currently populate modifiers.
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/hcpcs-level-2
            data_type: varchar
      - name: ingest_datetime
        description: Date and time the originating clinical procedure or medical claim line was loaded into the data warehouse. This is null when a claims-derived procedure cannot be tied reliably to one source claim line.
        config:
          meta:
            data_type: timestamp
      - name: tuva_last_run
        description: Timestamp for the dbt run that created the procedure record. Tuva
          populates this from the tuva_last_run variable.
        config:
          meta:
            data_type: timestamp
      - name: data_source
        description: User-defined name that identifies the source system or dataset for the
          procedure record. For claims-derived rows, this is populated from
          input_layer.medical_claim.data_source. For clinical rows, this is populated
          from input_layer.procedure.data_source.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
  - name: core__stg_claims_encounter
    description: Staging core claims encounters
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_core
        {% else %}core{%- endif -%}
      alias: _stg_claims_encounter
      tags:
        - core
        - core_stage_claims
        - encounters
      materialized: table
  - name: core__stg_claims_location
    description: Staging core claims locations
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_core
        {% else %}core{%- endif -%}
      alias: _stg_claims_location
      tags:
        - core
        - core_stage_claims
      materialized: table
  - name: core__stg_coderx_classes
    description: |-
      Canonical CodeRx drug-class interface used throughout Tuva Core and by dependent packages. Reads the bundled CodeRx Open asset by default and the user-managed coderx.classes source when use_coderx_enterprise is true. Selects the lexicographically first non-null level 3 ATC code when a drug has multiple class rows, preserving one row per drug_id.
    columns:
      - name: drug_id
        description: RxNorm RxCUI for the classified drug.
      - name: drug_name
        description: RxNorm name for the classified drug.
      - name: atc_1_code
        description: ATC level 1 code from the selected class hierarchy.
      - name: atc_1_name
        description: ATC level 1 name from the selected class hierarchy.
      - name: atc_2_code
        description: ATC level 2 code from the selected class hierarchy.
      - name: atc_2_name
        description: ATC level 2 name from the selected class hierarchy.
      - name: atc_3_code
        description: ATC level 3 code from the selected class hierarchy.
      - name: atc_3_name
        description: ATC level 3 name from the selected class hierarchy.
      - name: atc_4_code
        description: ATC level 4 code from the selected class hierarchy.
      - name: atc_4_name
        description: ATC level 4 name from the selected class hierarchy.
  - name: core__stg_coderx_drugs
    description: |-
      Canonical CodeRx drug interface used throughout Tuva Core and by dependent packages. Reads the bundled CodeRx Open asset by default and the user-managed coderx.drugs source when use_coderx_enterprise is true.
    columns:
      - name: drug_id
        description: RxNorm RxCUI for the drug concept.
