              'diagnosis_code_type', 'procedure_code_type', 'in_network_flag', 'file_date', 'ingest_datetime', 'file_name'
          ] %}
          select
              'claim-1' as claim_id
            , 1 as claim_line_number
            , cast(null as {{ string_type }}) as {{ plan_identifier }}
            {% for column in null_columns %}
            , cast(null as {{ string_type }}) as {{ column }}
            {% endfor %}
            {% for i in range(1, 26) %}
            , {% if i <= codes | length %}'{{ codes[i - 1] }}'{% else %}cast(null as {{ string_type }}){% endif %} as diagnosis_code_{{ i }}
            , cast(null as {{ string_type }}) as diagnosis_poa_{{ i }}
