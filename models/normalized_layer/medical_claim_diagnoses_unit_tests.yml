          {% set string_type = 'string' if target.type in ['bigquery', 'databricks'] else 'varchar' %}
          {% set codes = ['i21.4', 'I21.4 ', ' n18.6'] %}
          {% set null_columns = [
              'claim_type', 'person_id', 'member_id', 'payer', 'drg_code_type', 'service_unit_quantity',
              'hcpcs_code', 'hcpcs_modifier_1', 'hcpcs_modifier_2', 'hcpcs_modifier_3', 'hcpcs_modifier_4',
              'hcpcs_modifier_5', 'rendering_tin', 'billing_tin', 'paid_date', 'paid_amount', 'allowed_amount',
