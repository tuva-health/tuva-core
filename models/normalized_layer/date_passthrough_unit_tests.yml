version: 2

unit_tests:
  - name: test_medical_claim_dates_pass_through_without_calendar_membership
    description: Already-typed medical-claim dates are preserved during normalization even when they fall outside the supported range; Logical Data Quality reports those values separately.
    model: normalized_input__int_medical_claim_date_normalize
    config:
      enabled: "{{ var('claims_enabled', false) | as_bool }}"
    overrides:
      vars:
        tuva_last_run: '2024-02-15 00:00:00'
    given:
      - input: ref('normalized_input__stg_medical_claim')
        format: sql
        rows: |
          select
              'claim' as claim_id
            , 1 as claim_line_number
            , 'institutional' as claim_type
            , 'source' as data_source
            , cast('1899-12-31' as date) as claim_start_date
            , cast('2101-01-01' as date) as claim_end_date
            , cast('1899-12-30' as date) as claim_line_start_date
            , cast('2101-01-02' as date) as claim_line_end_date
            , cast('1899-12-29' as date) as admission_date
            , cast('2101-01-03' as date) as discharge_date
    expect:
      rows:
        - claim_id: claim
          claim_line_number: 1
          claim_type: institutional
          data_source: source
          normalized_claim_start_date: '1899-12-31'
          normalized_claim_end_date: '2101-01-01'
          normalized_claim_line_start_date: '1899-12-30'
          normalized_claim_line_end_date: '2101-01-02'
          normalized_admission_date: '1899-12-29'
          normalized_discharge_date: '2101-01-03'
          tuva_last_run: '2024-02-15 00:00:00'

  - name: test_normalized_medical_claim_keeps_undetermined_claim_end_date
    description: >-
      Proves that undetermined claims, which bypass the institutional and
      professional date aggregation, keep their own claim_end_date instead of
      receiving claim_start_date, including when only an end date is sent.
    model: normalized__medical_claim
    config:
      enabled: "{{ var('claims_enabled', false) | as_bool }}"
    overrides:
      vars:
        claims_enabled: true
        _extension_columns_override: []
        tuva_last_run: '2024-01-01 00:00:00'
    given:
      - input: ref('normalized_input__stg_medical_claim')
        format: sql
        rows: |
          {% set plan_identifier = '[plan]' if target.type in ['fabric', 'sqlserver'] else '`plan`' if target.type == 'bigquery' else 'plan' %}
          {% set string_type = 'string' if target.type in ['bigquery', 'databricks'] else 'varchar' %}
          {% set null_columns = [
              'person_id', 'member_id', 'payer', 'drg_code_type', 'service_unit_quantity',
              'hcpcs_code', 'hcpcs_modifier_1', 'hcpcs_modifier_2', 'hcpcs_modifier_3', 'hcpcs_modifier_4',
              'hcpcs_modifier_5', 'rendering_tin', 'billing_tin', 'paid_date', 'paid_amount', 'allowed_amount',
              'charge_amount', 'coinsurance_amount', 'copayment_amount', 'deductible_amount', 'total_cost_amount',
              'diagnosis_code_type', 'procedure_code_type', 'in_network_flag', 'file_date', 'ingest_datetime', 'file_name'
          ] %}
          {% for claim_id in ['claim-1', 'claim-2'] %}
          select
              '{{ claim_id }}' as claim_id
            , 1 as claim_line_number
            , 'undetermined' as claim_type
            , cast(null as {{ string_type }}) as {{ plan_identifier }}
            {% for column in null_columns %}
            , cast(null as {{ string_type }}) as {{ column }}
            {% endfor %}
            {% for i in range(1, 26) %}
            , cast(null as {{ string_type }}) as diagnosis_code_{{ i }}
            , cast(null as {{ string_type }}) as diagnosis_poa_{{ i }}
            {% endfor %}
            , 'source' as data_source
          {% if not loop.last %}union all{% endif %}
          {% endfor %}
      - input: ref('normalized_input__int_admit_source_final')
        format: sql
        rows: |
          {% set string_type = 'string' if target.type in ['bigquery', 'databricks'] else 'varchar' %}
          select
              cast(null as {{ string_type }}) as claim_id
            , cast(null as {{ string_type }}) as data_source
            , cast(null as {{ string_type }}) as normalized_code
            , cast(null as {{ string_type }}) as normalized_description
          from (select 1 as _tuva_empty_fixture) as _tuva_empty_fixture where 1 = 0
      - input: ref('normalized_input__int_admit_type_final')
        format: sql
        rows: |
          {% set string_type = 'string' if target.type in ['bigquery', 'databricks'] else 'varchar' %}
