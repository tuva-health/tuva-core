  - name: normalized__pharmacy_claim
    description: |
      The pharmacy claim table contains information on prescription drugs that
      were filled and billed to the insurer.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_intermediate
