  - name: int_eligibility_dates_normalized
    description: |-
      This model projects already-typed eligibility date fields from int_eligibility_casting. Birth, death, and enrollment dates pass through directly without using terminology-calendar membership as validation. Logical Data Quality reports values outside Tuva's supported 1900-through-2100 range while preserving the source value for investigation.

      The model keeps one distinct row per person_id and person_id_key.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_intermediate
        {%- else -%}intermediate{%- endif -%}
      alias: int_eligibility_dates_normalized
      meta:
        dag:
          node_type: intermediate
      materialized: table
      tags:
        - normalized_input
        - normalized_layer
    columns:
      - name: person_id
        description: Unique identifier for each person in the dataset from int_eligibility_casting.
      - name: person_id_key
        description: Synthetic join key from int_eligibility_casting. It is built from person_id, member_id, data_source, payer, plan, enrollment_start_date, and the canonical enrollment_end_date and is used to join normalized date values back to the eligibility record.
      - name: normalized_birth_date
        description: Birth date passed through as a native DATE without a calendar-membership requirement.
      - name: normalized_death_date
        description: Death date passed through as a native DATE without a calendar-membership requirement.
      - name: normalized_enrollment_start_date
        description: Enrollment start date passed through from int_eligibility_casting as a native DATE without a calendar-membership requirement.
      - name: normalized_enrollment_end_date
        description: Canonical enrollment end date passed through from int_eligibility_casting as a native DATE without a calendar-membership requirement. Null means the enrollment span remains open.

