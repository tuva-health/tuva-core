version: 2
models:
  - name: input_layer__medical_claim
    description: >-
      The medical_claim table is intended to have one record per medical claim line per data source. A medical claim represents healthcare services or supplies billed by a provider and adjudicated by a payer. A single claim may have multiple claim lines, so claim_id identifies the claim and claim_line_number identifies the specific line within that claim.


      This table should contain final adjudicated claim lines after the source data has been filtered or transformed to account for adjustments, denials, reversals, voids, and replacement claims. If non-final claim activity is included, downstream cost, utilization, quality, and risk adjustment outputs may be incorrect. Header-level fields, such as claim_type, person_id, payer, plan, claim_start_date, claim_end_date, admission_date, and discharge_date, should be consistent across all lines for the same claim_id. Line-level fields, such as claim_line_start_date, claim_line_end_date, revenue_center_code, hcpcs_code, service_unit_quantity, and payment amounts, may vary across claim lines.


      Primary key: claim_id, claim_line_number, data_source.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_input_layer{% else %}input_layer{%- endif -%}
      tags: input_layer
      materialized: view
    columns:
      - name: claim_id
        description: >-
          Identifier for a medical claim. A claim may contain multiple claim lines, so the same claim_id may appear on multiple rows. This value should be populated on every row and should remain consistent across all lines for the same claim.
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: claim_line_number
        description: >-
          Line number for the claim line represented by the row. Values should be positive integers and should uniquely identify each line within a claim_id. If the source does not provide reliable line numbers, create them during mapping.
        config:
          meta:
            data_type: integer
            is_primary_key: true
      - name: claim_type
        description: >-
          Header-level classification of the medical claim as professional, institutional, or undetermined. This value should be consistent across all lines for the same claim_id. If claim_type is not provided by the source, derive it from claim content: professional claims should have a place_of_service_code and should not have institutional-only fields such as bill_type_code or revenue_center_code; institutional claims should have bill_type_code and revenue_center_code and should not have place_of_service_code. If the source does not clearly support either pattern, use undetermined until the classification can be resolved. Some payers populate institutional claims with place_of_service_code values or create nonstandard place of service codes, so review source-specific behavior carefully before deriving claim_type.
        config:
          meta:
            data_type: varchar
      - name: person_id
        description: >-
          Globally unique identifier for the person who received care. A person may have multiple member IDs over time or across plans, but person_id should remain stable for the same person.
        config:
          meta:
            data_type: varchar
      - name: member_id
        description: >-
          Identifier assigned by the payer or health plan for the person's coverage. This should identify the member associated with the claim and should be consistent across all lines for the same claim_id.
        config:
          meta:
            data_type: varchar
      - name: payer
        description: >-
          Name of the payer responsible for the claim, for example Aetna, Blue Cross Blue Shield, or Medicare FFS. If the source data is scoped to one payer, this value may be hard-coded.
        config:
          meta:
            data_type: varchar
      - name: plan
        description: >-
          Name of the health insurance plan or product associated with the claim, for example Aetna PPO or Humana HMO. If unavailable in the source, this value may be hard-coded to a stable plan value for the data source.
        config:
          meta:
            data_type: varchar
      - name: claim_start_date
        description: >-
          Header-level start date for the claim, formatted as YYYY-MM-DD. This value should be consistent across all lines for the same claim_id.
        config:
          meta:
            data_type: date
      - name: claim_end_date
        description: >-
          Header-level end date for the claim, formatted as YYYY-MM-DD. This value should be consistent across all lines for the same claim_id and should be greater than or equal to claim_start_date.
        config:
          meta:
            data_type: date
      - name: claim_line_start_date
        description: >-
          Start date for the service or item represented by the claim line, formatted as YYYY-MM-DD. This may differ across lines within the same claim.
        config:
          meta:
            data_type: date
      - name: claim_line_end_date
        description: >-
          End date for the service or item represented by the claim line, formatted as YYYY-MM-DD. This may differ across lines within the same claim and should be greater than or equal to claim_line_start_date.
        config:
          meta:
            data_type: date
      - name: admission_date
        description: >-
          Header-level admission date for an inpatient institutional claim, formatted as YYYY-MM-DD. Populate when the claim represents an inpatient facility stay. This value should be consistent across all lines for the same inpatient institutional claim.
        config:
          meta:
            data_type: date
      - name: discharge_date
        description: >-
          Header-level discharge date for an inpatient institutional claim, formatted as YYYY-MM-DD. Populate when the claim represents an inpatient facility stay. This value should be consistent across all lines for the same inpatient institutional claim and should be greater than or equal to admission_date.
        config:
          meta:
            data_type: date
      - name: admit_source_code
        description: >-
          Header-level code indicating the source of admission for an inpatient institutional claim. This value should be consistent across all lines for the same claim_id.
        config:
          meta:
            data_type: varchar
      - name: admit_type_code
        description: >-
          Header-level code indicating the priority or type of admission for an inpatient institutional claim, such as emergency, urgent, or elective. This value should be consistent across all lines for the same claim_id.
        config:
          meta:
            data_type: varchar
      - name: discharge_disposition_code
        description: >-
          Header-level code indicating where the person was discharged after an inpatient institutional stay. This value should be consistent across all lines for the same claim_id. Preserve leading zeroes when present in the standard code set.
        config:
          meta:
            data_type: varchar
      - name: place_of_service_code
        description: >-
          Line-level code indicating where a professional service was provided. Professional claim lines should generally have a place_of_service_code; institutional claims should never have a place_of_service_code. Some payers create nonstandard place of service codes or populate institutional claims with place_of_service_code values even though this is not technically allowed, so review source-specific behavior carefully during mapping.
        config:
          meta:
            data_type: varchar
      - name: bill_type_code
        description: >-
          Header-level bill type code for institutional claims. This identifies the type of facility claim and should be consistent across all lines for the same claim_id. Preserve leading zeroes when present in the standard code set.
        config:
          meta:
            data_type: varchar
      - name: drg_code_type
        description: >-
          DRG coding system for drg_code. Accepted values are ms-drg and apr-drg. Populate when drg_code is populated.
        config:
          meta:
            data_type: varchar
      - name: drg_code
        description: >-
          Diagnosis Related Group code for an inpatient claim. This is header-level information and should be consistent across all lines for the same claim_id.
        config:
          meta:
            data_type: varchar
      - name: revenue_center_code
        description: >-
          Line-level revenue center code for institutional claims. This identifies the department or service area associated with the claim line and should preserve leading zeroes when present in the standard code set.
        config:
          meta:
            data_type: varchar
      - name: service_unit_quantity
        description: >-
          Number of service units for the claim line. This may represent units associated with a revenue center, procedure, service, or supply.
        config:
          meta:
            data_type: number
      - name: hcpcs_code
        description: >-
          CPT or HCPCS code for the procedure, service, or supply on the claim line. This is line-level information and may vary across lines within the same claim.
        config:
          meta:
            data_type: varchar
      - name: hcpcs_modifier_1
        description: >-
          Modifier 1 applied to the claim line hcpcs_code. Modifiers provide additional context about how or where the service was performed. Leave null when not present.
        config:
          meta:
            data_type: varchar
      - name: hcpcs_modifier_2
        description: >-
          Modifier 2 applied to the claim line hcpcs_code. Modifiers provide additional context about how or where the service was performed. Leave null when not present.
        config:
          meta:
            data_type: varchar
      - name: hcpcs_modifier_3
        description: >-
          Modifier 3 applied to the claim line hcpcs_code. Modifiers provide additional context about how or where the service was performed. Leave null when not present.
        config:
          meta:
            data_type: varchar
      - name: hcpcs_modifier_4
        description: >-
          Modifier 4 applied to the claim line hcpcs_code. Modifiers provide additional context about how or where the service was performed. Leave null when not present.
        config:
          meta:
            data_type: varchar
      - name: hcpcs_modifier_5
        description: >-
          Modifier 5 applied to the claim line hcpcs_code. Modifiers provide additional context about how or where the service was performed. Leave null when not present.
        config:
          meta:
            data_type: varchar
      - name: rendering_npi
        description: >-
          NPI for the practitioner or provider who rendered the service on the claim line. This is generally line-level and may vary across lines. NPIs should be 10-digit identifiers.
        config:
          meta:
            data_type: varchar
      - name: rendering_tin
        description: >-
          Tax Identification Number for the rendering provider associated with the claim line.
        config:
          meta:
            data_type: varchar
      - name: billing_npi
        description: >-
          NPI for the billing provider or organization responsible for submitting the claim. This is generally header-level and should be consistent across lines for the same claim_id. NPIs should be 10-digit identifiers.
        config:
          meta:
            data_type: varchar
      - name: billing_tin
        description: >-
          Tax Identification Number for the billing provider or organization.
        config:
          meta:
            data_type: varchar
      - name: facility_npi
        description: >-
          NPI for the facility where services were delivered. This is especially important for institutional claims and encounter grouping. NPIs should be 10-digit identifiers.
        config:
          meta:
            data_type: varchar
      - name: paid_date
        description: >-
          Date the claim was paid by the payer, formatted as YYYY-MM-DD. This often occurs after claim_end_date.
        config:
          meta:
            data_type: date
      - name: paid_amount
        description: >-
          Amount paid by the payer for the claim line. This should reflect final adjudicated payment after adjustment, denial, reversal, and replacement logic has been applied.
        config:
          meta:
            data_type: float
      - name: allowed_amount
        description: >-
          Total allowed amount for the claim line, including payer-paid and patient-responsibility amounts. This is generally expected to equal paid_amount plus coinsurance_amount plus copayment_amount plus deductible_amount when those fields are available.
        config:
          meta:
            data_type: float
      - name: charge_amount
        description: >-
          Amount charged or billed by the provider for the claim line before payer adjudication.
        config:
          meta:
            data_type: float
      - name: coinsurance_amount
        description: >-
          Coinsurance amount owed by the member for the claim line. This represents percentage-based member cost sharing.
        config:
          meta:
            data_type: float
      - name: copayment_amount
        description: >-
          Copayment amount owed by the member for the claim line. This represents fixed-dollar member cost sharing.
        config:
          meta:
            data_type: float
      - name: deductible_amount
        description: >-
          Deductible amount owed by the member for the claim line before payer coverage applies.
        config:
          meta:
            data_type: float
      - name: total_cost_amount
        description: >-
          Total cost amount for the claim line. This may equal allowed_amount, but can differ when the source includes additional cost components not captured by the standard payer-paid and patient-responsibility fields.
        config:
          meta:
            data_type: float
      - name: paid_reduced_by
        description: >-
          Amount by which the payer reduced its payment on the claim line under a prospective or population-based payment arrangement, such as the Medicare Population-Based Payment (PBP) reduction reported in CCLF demonstration code files. paid_amount reflects the payment after this reduction, so paid_amount plus paid_reduced_by approximates the fee-for-service payment before the reduction. Null when the source does not report a reduction.
        config:
          meta:
            data_type: float
      - name: diagnosis_code_type
        description: >-
          Coding system used for diagnosis codes on the claim. Accepted values are icd-9-cm and icd-10-cm. This is header-level and should be consistent across all lines for the same claim_id.
        config:
          meta:
            data_type: varchar
      - name: diagnosis_code_1
        description: >-
          Primary or first-listed ICD diagnosis code on the claim. For institutional claims, this should generally be the principal diagnosis. This is header-level information and should be consistent across all lines for the same claim_id.
        config:
